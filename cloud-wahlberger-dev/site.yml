---
# Top-level playbook. Convention: `site.yml` applies the *entire* configuration
# to every host. As the stack grows, split concerns into per-tier playbooks and
# pull them together here with `import_playbook:`.
#
# Run with:  ansible-playbook site.yml
# Limit to one role:  ansible-playbook site.yml --tags podman
- name: Configure the cloud.wahlberger.dev host
  hosts: cloud
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common]
    # Early: other roles' units can hook OnFailure= into the unit this role
    # deploys.
    - role: notify_failure
      tags: [notify_failure]
    # Periodic disk usage check, emailing via notify_failure — the only
    # thing in this stack that watches disk space at all.
    - role: disk_space
      tags: [disk_space]
    # Personal + Semaphore automation SSH keys, authorized before hardening.
    - role: ssh_authorized_keys
      tags: [ssh_authorized_keys]
    # Harden the host before anything else listens on the network.
    - role: geerlingguy.security
      tags: [security]
    # After notify_failure (reuses its Resend credentials) and security
    # (enables security_autoupdate_reboot, the reboot this role emails
    # about).
    - role: reboot_notify
      tags: [reboot_notify]
    - role: firewall
      tags: [firewall]
    - role: podman
      tags: [podman]
    # Route to the home LAN (uptime_kuma needs it to reach nas/pi's private
    # IPs) — see roles/zerotier/README.md.
    - role: zerotier
      tags: [zerotier]
    # Ensure this host's public DNS records exist before Caddy needs them.
    - role: cloudflare_dns
      tags: [cloudflare_dns]
    # Reverse proxy (creates the shared network), then the Pocket ID service.
    - role: caddy
      tags: [caddy]
    - role: pocket_id
      tags: [pocket_id]
    # FreshRSS (RSS aggregator), authenticating against Pocket ID via OIDC.
    - role: freshrss
      tags: [freshrss]
    # External watcher for the whole infrastructure (nas/pi going dark
    # entirely) — gated by oauth2-proxy + Pocket ID, not its own login.
    - role: uptime_kuma
      tags: [uptime_kuma]

---
# Production inventory.
#
# This file holds only the host/group *structure*. All variables (connection
# details, role settings, secrets) live in group_vars/ and host_vars/ so that
# "what exists" stays separate from "how it's configured".
#
# To add a staging environment, copy the inventories/production/ tree to
# inventories/staging/ and run with `-i inventories/staging/hosts.yml`.
all:
  children:
    cloud:
      hosts:
        cloud.wahlberger.dev:

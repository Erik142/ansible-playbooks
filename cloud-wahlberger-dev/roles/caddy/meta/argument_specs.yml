---
argument_specs:
  main:
    short_description: Caddy reverse proxy with automatic HTTPS.
    options:
      caddy_image:
        type: str
        required: false
        description: Caddy container image (use the official image).
      caddy_data_dir:
        type: path
        required: false
        description: Host directory for the Caddyfile and Caddy state (certs).
      caddy_http_port:
        type: int
        required: false
        description: Host port mapped to the container's port 80.
      caddy_https_port:
        type: int
        required: false
        description: Host port mapped to the container's port 443.
      caddy_acme_email:
        type: str
        required: false
        description: Email for Let's Encrypt registration (optional).
      caddy_sites:
        type: list
        elements: dict
        required: false
        description: Sites to serve.
        options:
          host:
            type: str
            required: true
            description: Public hostname to serve.
          upstream:
            type: str
            required: false
            description: >-
              container_name:port to reverse_proxy to. Omit for a site whose
              whole body is custom (e.g. an auth-gated site built entirely
              from `extra`, where reverse_proxy isn't the top-level
              directive) — see roles/caddy/README.md.
          extra:
            type: str
            required: false
            description: Optional raw Caddy directives for the site block.

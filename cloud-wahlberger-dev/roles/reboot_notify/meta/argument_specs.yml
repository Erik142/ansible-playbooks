---
argument_specs:
  main:
    short_description: Email a heads-up as soon as an unattended-upgrades-triggered reboot is needed.
    description:
      - Installs needrestart (which maintains /var/run/reboot-required —
        Debian has no update-notifier-common) and extends its apt hook
        script to also email, reusing notify_failure's Resend credentials,
        synchronously the first time it detects a reboot is needed — i.e.
        this is actually because of a pending kernel update, not an
        ordinary manual one. Its own notification class, not a failure
        alert. No variables of its own; see README.md.
    options: {}

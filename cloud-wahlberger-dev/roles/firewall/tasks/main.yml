---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow forwarded traffic so Podman published ports keep working
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="{{ firewall_forward_policy }}"'
  notify: Reload ufw

- name: Allow DNS UDP traffic from Podman interfaces in UFW
  community.general.ufw:
    rule: allow
    direction: in
    interface: podman+
    to_port: '53'
    proto: udp
    comment: "Allow Podman containers to access host DNS proxy"

- name: Allow DNS TCP traffic from Podman interfaces in UFW
  community.general.ufw:
    rule: allow
    direction: in
    interface: podman+
    to_port: '53'
    proto: tcp
    comment: "Allow Podman containers to access host DNS proxy (TCP fallback)"

# Scoped to the Podman bridge only (not opened to the internet, unlike
# firewall_allowed_tcp_ports below): the beszel_hub container reaches this
# host's own beszel_agent via host.containers.internal, which crosses this
# same interface — see roles/beszel_agent/README.md.
- name: Allow Beszel agent traffic from Podman interfaces in UFW
  community.general.ufw:
    rule: allow
    direction: in
    interface: podman+
    to_port: "{{ beszel_agent_port }}"
    proto: tcp
    comment: "Allow the local Beszel hub container to reach the beszel_agent on this host"

# Allow the service ports BEFORE enabling, so enabling can never lock out SSH.
- name: Allow inbound TCP service ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Set the default incoming policy to {{ firewall_default_incoming }}
  community.general.ufw:
    direction: incoming
    policy: "{{ firewall_default_incoming }}"

- name: Set the default outgoing policy to {{ firewall_default_outgoing }}
  community.general.ufw:
    direction: outgoing
    policy: "{{ firewall_default_outgoing }}"

- name: Set the ufw logging level
  community.general.ufw:
    logging: "{{ firewall_logging }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled

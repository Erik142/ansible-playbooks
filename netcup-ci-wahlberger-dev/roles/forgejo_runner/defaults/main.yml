---
# Default variables for the `forgejo_runner` role.

# Exact tag (v9.1.1 checked 2026-10-17). The image has an empty entrypoint, so
# commands name /bin/forgejo-runner explicitly.
forgejo_runner_image: "code.forgejo.org/forgejo/runner:13.2.1"

# Forgejo instance on the NAS. Reached over ZeroTier (see README). The runner
# connects outbound only.
forgejo_runner_instance_url: "https://git.de.int.wahlberger.dev"
forgejo_runner_name: "netcup-ci"

# Runner registration token. Secret: vault_forgejo_runner_registration_token
# (vars.yml passes it through).
forgejo_runner_registration_token: ""

# One job at a time. A single bitbake build takes the whole host, and job
# containers are created through the socket, so the unit's MemoryMax/CPUQuota do
# not cover them. Jobs are uncapped; see the README for the decision.
forgejo_runner_capacity: 1

# systemd limits for the runner daemon itself (12 vCPU, 32 GB host).
forgejo_runner_memory_max: 4G
forgejo_runner_cpu_quota: "200%"

# Job images. Each must contain node: actions/checkout and other JavaScript
# actions run under it. Pinned by digest; Renovate tracks the digests through
# the netcup entry in renovate.json. The podman image is built on the host from
# forgejo_runner_podman_base_image (see the Containerfile template).
forgejo_runner_ubuntu_image: "docker.io/library/node:26-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853"
forgejo_runner_python_image: "docker.io/nikolaik/python-nodejs:python3.12-nodejs22@sha256:e2323c3c2c92fd219d5662d631cd0d6efe9891ebf0e5e81e24db81ba0221ddb1"
forgejo_runner_node_image: "docker.io/library/node:26-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853"
forgejo_runner_podman_base_image: "quay.io/podman/stable@sha256:2fb39ca923dd9e0ee33f9e319c3a107a2bfde022a6a31560cbd56a862821e7d3"
forgejo_runner_podman_image: "localhost/ci-podman-node:1"

# Labels offered to workflows: `<label>:<image>`.
forgejo_runner_labels:
  - "ubuntu-latest:docker://{{ forgejo_runner_ubuntu_image }}"
  - "python:docker://{{ forgejo_runner_python_image }}"
  - "node:docker://{{ forgejo_runner_node_image }}"
  - "podman:docker://{{ forgejo_runner_podman_image }}"

# Dedicated unprivileged account running rootless Podman. No login shell.
forgejo_runner_user: forgejo-runner
forgejo_runner_home: "/var/lib/{{ forgejo_runner_user }}"
forgejo_runner_config_dir: "{{ forgejo_runner_home }}/config"
# Registration state (.runner) and job workspaces. Mounted at the SAME absolute
# path inside the container: the runner hands these paths to podman through the
# socket, and podman resolves them on the host.
forgejo_runner_state_dir: "{{ forgejo_runner_home }}/state"
forgejo_runner_quadlet_dir: "{{ forgejo_runner_home }}/.config/containers/systemd"
forgejo_runner_images_dir: "{{ forgejo_runner_home }}/images"

# Persistent build cache (bitbake sstate + downloads). Outside the job
# workspace, so job cleanup does not touch it. A nested btrfs subvolume of @/srv,
# which snapper does not snapshot. Not in restic.
forgejo_runner_cache_dir: /srv/ci-cache
forgejo_runner_cache_subvolume: true

# Optional PEM bundle for the NAS's certificate chain, if it is not signed by a
# public CA. Empty means the system trust store (public CA only).
forgejo_runner_ca_file: ""

# Unused images: dangling layers older than this are pruned weekly by the
# runner's own user timer. Tagged images stay until their tag moves.
forgejo_runner_prune_until: "168h"

# Molecule only: skip everything that needs a real user manager, lingering, the
# rootless socket or btrfs. Rendering (account files, config, Quadlet) still runs.
forgejo_runner_skip_runtime: false

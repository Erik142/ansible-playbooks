---
# Default variables for the `forgejo_runner` role.

# Exact tag (v9.1.1 checked 2026-10-17). The image has an empty entrypoint, so
# commands name /bin/forgejo-runner explicitly.
forgejo_runner_image: "code.forgejo.org/forgejo/runner:9.1.1"

# Forgejo instance on the NAS. Reached over ZeroTier (see README, "Confirm
# before implementing"). The runner connects outbound only.
forgejo_runner_instance_url: "https://git.de.int.wahlberger.dev"
forgejo_runner_name: "netcup-ci"

# Runner registration token. Secret: vault_forgejo_runner_registration_token (vars.yml passes it through).
forgejo_runner_registration_token: ""

# Concurrency cap. Each job also gets per-container limits (below), because
# job containers are created by podman through the socket and live outside
# this unit's cgroup, so the unit's MemoryMax/CPUQuota do not cover them.
# One job at a time: a single bitbake build takes the whole host, and two jobs
# with these limits would oversubscribe 12 vCPU / 32 GB.
forgejo_runner_capacity: 1
# Per-job ceiling for one bitbake build. Leaves ~4 GB for the OS, the runner
# daemon and the manual builds' overhead. Raise to 30g if the OS stays idle.
forgejo_runner_job_memory: 28g
forgejo_runner_job_cpus: 12

# systemd limits for the runner daemon itself (12 vCPU, 32 GB host; leaves room
# for manual bitbake builds).
forgejo_runner_memory_max: 4G
forgejo_runner_cpu_quota: "200%"

# Labels offered to workflows: `<label>:<image>`. Proposal, not final.
# Every image must contain node: actions/checkout and other JavaScript actions run
# under it. The podman image is built on the host (images/Containerfile.podman-node).
forgejo_runner_labels:
  - "ubuntu-latest:docker://docker.io/library/node:22-bookworm"
  - "python:docker://docker.io/nikolaik/python-nodejs:python3.12-nodejs22"
  - "node:docker://docker.io/library/node:22-bookworm"
  - "podman:docker://{{ forgejo_runner_podman_image }}"

# Dedicated unprivileged account running rootless Podman. No login shell.
forgejo_runner_user: forgejo-runner
forgejo_runner_home: "/var/lib/{{ forgejo_runner_user }}"
forgejo_runner_config_dir: "{{ forgejo_runner_home }}/config"
# Registration state (.runner) and job workspaces. Mounted at the SAME absolute
# path inside the container: the runner hands these paths to podman through the
# socket, and podman resolves them on the host.
forgejo_runner_state_dir: "{{ forgejo_runner_home }}/state"
forgejo_runner_quadlet_dir: "{{ forgejo_runner_home }}/.config/containers/systemd"

# Persistent build cache (bitbake sstate + downloads). Outside the job
# workspace, so job cleanup does not touch it. Created as a btrfs subvolume
# (snapper does not snapshot nested subvolumes). Not in restic.
forgejo_runner_cache_dir: /srv/ci-cache
forgejo_runner_cache_subvolume: true

# Optional PEM bundle for the NAS's certificate chain, if it is not signed by a
# public CA. Empty means the system trust store (public CA only).
forgejo_runner_ca_file: ""

# Molecule only: skip everything that needs a real user manager, lingering, the
# rootless socket or btrfs. Rendering (account files, config, Quadlet) still runs.
forgejo_runner_skip_runtime: false

# Base for the `podman` label image, which is built on the host (see tasks).
forgejo_runner_podman_base_image: "quay.io/podman/stable"
forgejo_runner_podman_image: "localhost/ci-podman-node:1"
forgejo_runner_images_dir: "{{ forgejo_runner_home }}/images"

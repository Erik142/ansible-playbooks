---
argument_specs:
  main:
    short_description: Authorize one or more SSH public keys for manual and unattended access.
    options:
      ssh_authorized_keys_user:
        type: str
        required: false
        description: Unix account the keys are authorized for.
      ssh_authorized_keys_list:
        type: list
        elements: str
        required: true
        description: Public key lines (ssh-ed25519/ssh-rsa ... comment) to authorize. A line may start with authorized_keys options such as from="a,b".
      ssh_authorized_keys_revoked:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          Public key lines to remove from the account. Matched on key type and
          body. The role fails before any change if a key is also in
          ssh_authorized_keys_list.

---
argument_specs:
  main:
    short_description: Opens and closes a Hush maintenance window around an ansible apply.
    options:
      hush_maintenance_enabled:
        type: bool
        required: false
        default: true
        description: When false, the role does nothing.
      hush_maintenance_duration_seconds:
        type: int
        required: false
        default: 1800
        description: Window length in seconds. Hush ends the window on its own when it expires.
      hush_maintenance_host_names:
        type: list
        elements: str
        required: false
        default: []
        description: Hush host names the window is scoped to. Empty skips the role.
      hush_maintenance_base_url:
        type: str
        required: false
        default: "https://hush.de.int.wahlberger.dev"
        description: Base URL of the Hush API.

---
- name: Install fail2ban and nftables
  community.general.zypper:
    name:
      - fail2ban
      - nftables
    state: present
  when: security_fail2ban_enabled | bool

- name: Render the fail2ban jail for sshd
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  when: security_fail2ban_enabled | bool
  notify: Reload fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: security_fail2ban_enabled | bool
  register: security_fail2ban_service
  # --check on a fresh host: the package/unit file does not exist yet because the
  # tasks above only simulated installing it. Only that exact miss is tolerated,
  # and only in check mode; a real run still fails.
  failed_when:
    - security_fail2ban_service is failed
    - not (ansible_check_mode and (security_fail2ban_service.msg | default('')) is search('Could not find the requested service'))

---
# Production inventory. Structure only; variables live in group_vars/.
#
# The inventory name is the host's real FQDN: common sets the system hostname
# from it, so it must stay ci.de.wahlberger.dev (the name the VPS already has).
# Ansible connects over ZeroTier via the ZeroTier record ci.de.int.wahlberger.dev
# (published by cloudflare_dns), so runs need no -e ansible_host.
all:
  children:
    ci:
      hosts:
        ci.de.wahlberger.dev:
          ansible_host: ci.de.int.wahlberger.dev

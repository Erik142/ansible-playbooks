---
# Where each VM vault key comes from (read by tools/populate-vault.sh).
#   <playbook>:<key>        copy the value of <key> from that playbook's Vault
#                           (pi = pi-de-int-wahlberger-dev, cloud = cloud-wahlberger-dev,
#                           nas = nas-de-int-wahlberger-dev), byte for byte
#   generate:alnum32        32 random [A-Za-z0-9] characters, drawn locally
# The key set must equal group_vars/all/vault.yml.example and the vault_* names
# that group_vars/all/vars.yml references (tests/tools/test_populate_vault.py).

# SH-FR-43, 44, 146, 46, 201: Semaphore's own secrets, equal to the Pi's.
vault_semaphore_access_key_encryption: pi:vault_semaphore_access_key_encryption
vault_semaphore_cookie_hash: pi:vault_semaphore_cookie_hash
vault_semaphore_cookie_encryption: pi:vault_semaphore_cookie_encryption
vault_semaphore_admin_password: pi:vault_semaphore_admin_password
vault_semaphore_oidc_client_secret: pi:vault_semaphore_oidc_client_secret

# SH-FR-147, 148: the Cloudflare zone token and the Resend key, equal to the Pi's.
vault_cloudflare_dns_api_token: pi:vault_cloudflare_dns_api_token
vault_notify_failure_resend_api_key: pi:vault_notify_failure_resend_api_key

# SH-BR-09: new values; T-20 copies both into the NAS vault.
vault_restic_backup_repo_password: generate:alnum32
vault_restic_backup_rest_server_password: generate:alnum32

# Hush (roles/hush). Generated secrets are kept on a rebuild. The three manual
# values are typed by the operator and kept from the current vault on a rebuild.
# Forgejo pull token (read:package), created by hand in Forgejo.
vault_hush_forgejo_pull_token: manual
# Healthchecks.io ping URL (dead-man's switch). Created by hand at healthchecks.io.
vault_hush_heartbeat_url: manual
# Bearer and HMAC secrets for hush sources. Each must also be entered in the
# consumer (Uptime Kuma webhook, hook scripts, restic hook); see roles/hush/README.md.
vault_hush_source_kuma: generate:alnum32
vault_hush_source_hooks_ops: generate:alnum32
vault_hush_source_hooks_nas: generate:alnum32
vault_hush_source_hooks_cloud: generate:alnum32
vault_hush_source_hooks_netcup: generate:alnum32
# TrueNAS alert webhook path token (hush 0.6.0). Set in the TrueNAS alert service URL.
vault_hush_source_truenas: generate:alnum32
vault_hush_source_backup_ops: generate:alnum32
vault_hush_source_backup_cloud: generate:alnum32
vault_hush_maintenance_ansible: generate:alnum32
vault_hush_metrics_token: generate:alnum32
# Inert while auth.break_glass.enabled is false. Replace with a real password hash
# before enabling break-glass login.
vault_hush_break_glass_hash: generate:alnum32
# Operator-supplied: Anthropic API key, a separate Resend key for hush, and the
# Pocket ID client secret of the hush OIDC client.
vault_hush_anthropic_key: manual
vault_hush_resend_key: manual
vault_hush_oidc_secret: manual

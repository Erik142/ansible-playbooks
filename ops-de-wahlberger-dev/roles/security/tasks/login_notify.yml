---
# SH-FR-125: email on every successful SSH login from a public source. A small
# service follows sshd's journal ("Accepted publickey ..." carries user,
# source address and key fingerprint). It is deliberately not a PAM hook: a
# faulty PAM line can lock everybody out, a faulty watcher cannot (SH-E-32).
- name: Check that notify_failure deployed the Resend credentials
  ansible.builtin.stat:
    path: /etc/notify-failure/notify-failure.env
  register: security_login_notify_env
  when: security_ssh_login_notify_enabled | bool

- name: Refuse to deploy the login email without the Resend credentials
  ansible.builtin.assert:
    that: security_login_notify_env.stat.exists
    fail_msg: >-
      /etc/notify-failure/notify-failure.env is missing. The notify_failure role
      must run before security (see site.yml).
    quiet: true
  when:
    - security_ssh_login_notify_enabled | bool
    - not ansible_check_mode

- name: Deploy the login notification script
  ansible.builtin.copy:
    src: ssh-login-notify.py
    dest: /usr/local/bin/ssh-login-notify.py
    owner: root
    group: root
    mode: "0750"
  when: security_ssh_login_notify_enabled | bool
  notify: Restart ssh-login-notify

- name: Deploy the login notification service
  ansible.builtin.template:
    src: ssh-login-notify.service.j2
    dest: /etc/systemd/system/ssh-login-notify.service
    owner: root
    group: root
    mode: "0644"
  when: security_ssh_login_notify_enabled | bool
  notify:
    - Reload systemd
    - Restart ssh-login-notify

- name: Apply the unit before enabling it
  ansible.builtin.meta: flush_handlers

- name: Enable and start the login notification service
  ansible.builtin.systemd:
    name: ssh-login-notify.service
    enabled: true
    state: started
  when: security_ssh_login_notify_enabled | bool
  register: security_login_notify_service
  # --check on a fresh host: the package/unit file does not exist yet because the
  # tasks above only simulated installing it. Only that exact miss is tolerated,
  # and only in check mode; a real run still fails.
  failed_when:
    - security_login_notify_service is failed
    - not (ansible_check_mode and (security_login_notify_service.msg | default('')) is search('Could not find the requested service'))

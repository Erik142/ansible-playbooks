---
- name: Validate notify_failure inputs are present
  ansible.builtin.assert:
    that:
      - notify_failure_resend_api_key | length > 0
      - notify_failure_hush_token | length > 0
    fail_msg: >-
      notify_failure_resend_api_key or notify_failure_hush_token is empty. Set
      vault_notify_failure_resend_api_key and the host's vault_hush_source_hooks_* in Ansible Vault.
    quiet: true
  no_log: true

- name: Install jq
  community.general.zypper:
    name: jq
    state: present

- name: Create the notify_failure config directory
  ansible.builtin.file:
    path: /etc/notify-failure
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the notify_failure environment file
  ansible.builtin.template:
    src: notify-failure.env.j2
    dest: /etc/notify-failure/notify-failure.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Deploy the email HTML template
  ansible.builtin.copy:
    src: email-template.html
    dest: /etc/notify-failure/email-template.html
    owner: root
    group: root
    mode: "0644"

- name: Deploy the notification script
  ansible.builtin.template:
    src: notify-failure.sh.j2
    dest: /usr/local/bin/notify-failure.sh
    owner: root
    group: root
    mode: "0700"

# Hush hook scripts (vendored from hush v0.5.0, deploy/hooks). Contract: hush docs,
# deploy/hooks/README.md. The environment comes from /etc/hush/hook.env.
- name: Create the hush configuration directory
  ansible.builtin.file:
    path: /etc/hush
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the hush hook scripts
  ansible.builtin.copy:
    src: "hush/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [hush-post, hush-run-job, hush-systemd-event, hush-change, hush-boot-report]

- name: Deploy the hush hook units
  ansible.builtin.copy:
    src: "hush/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [hush-notify@.service, hush-notify-ok@.service, hush-boot-report.service]
  notify: Reload systemd

- name: Write the hush hook environment file
  ansible.builtin.template:
    src: hook.env.j2
    dest: /etc/hush/hook.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Write the hush bearer token file for this host
  ansible.builtin.copy:
    content: "{{ notify_failure_hush_token }}"
    dest: /etc/hush/systemd.token
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Enable the boot report to hush
  ansible.builtin.systemd:
    name: hush-boot-report.service
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: Deploy the notify-failure@.service template unit
  ansible.builtin.template:
    src: "notify-failure@.service.j2"
    dest: /etc/systemd/system/notify-failure@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy the notify-failure-immediate@.service template unit
  ansible.builtin.template:
    src: "notify-failure-immediate@.service.j2"
    dest: /etc/systemd/system/notify-failure-immediate@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

---
- name: Validate beszel_agent inputs are present
  ansible.builtin.assert:
    that:
      - beszel_agent_hub_key | length > 0
    fail_msg: >-
      beszel_agent_hub_key is empty. Deploy roles/beszel_hub first, copy its
      generated SSH public key from the hub's web UI, set
      beszel_agent_hub_key in group_vars, and re-run. See
      roles/beszel_agent/README.md.
    quiet: true

- name: Create the beszel system group
  ansible.builtin.group:
    name: "{{ beszel_agent_group }}"
    system: true

# No login shell, no home directory: this account only ever runs the agent
# binary under systemd, matching Beszel's own installer.
- name: Create the beszel system user
  ansible.builtin.user:
    name: "{{ beszel_agent_user }}"
    group: "{{ beszel_agent_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

# Podman's rootful API socket is group-owned by "root" by default (see
# roles/podman/README.md) — much too broad to add this unprivileged agent
# to. Give it its own narrowly-scoped group instead.
- name: Create the podman socket access group
  ansible.builtin.group:
    name: "{{ beszel_agent_podman_group }}"
    system: true

- name: Add the beszel user to the podman socket access group
  ansible.builtin.user:
    name: "{{ beszel_agent_user }}"
    groups: "{{ beszel_agent_podman_group }}"
    append: true

- name: Create a systemd drop-in directory for podman.socket
  ansible.builtin.file:
    path: /etc/systemd/system/podman.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Override podman.socket's group so beszel_agent_podman_group can use it
  ansible.builtin.copy:
    dest: /etc/systemd/system/podman.socket.d/beszel-agent.conf
    content: |
      [Socket]
      SocketGroup={{ beszel_agent_podman_group }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart podman.socket

# Flushed immediately (not at end-of-play) so the socket's new group is
# actually in place before the agent first starts further down.
- name: Apply the podman.socket override now
  ansible.builtin.meta: flush_handlers

# The socket FILE's own group (set above) isn't enough on its own: reaching
# it at all requires *search* permission on every directory component of
# its path, same underlying rule as the samba role's SELinux search-access
# note. podman.socket creates this directory itself on activation, and its
# default mode is apparently not guaranteed the same across hosts/versions
# — confirmed 0700 root:root here (blocking beszel_agent_user entirely)
# versus 0755 on another host in this repo. Fix it directly (immediate
# effect this run) — see below for why this alone won't survive a reboot.
- name: Make the Podman socket directory traversable by the podman group
  ansible.builtin.file:
    path: /run/podman
    state: directory
    owner: root
    group: "{{ beszel_agent_podman_group }}"
    mode: "0755"
  notify: Restart beszel-agent
  register: beszel_agent_run_podman_dir
  # --check on a fresh host: the group was only simulated above. Only that
  # exact miss is tolerated, and only in check mode; a real run still fails.
  failed_when:
    - beszel_agent_run_podman_dir is failed
    - not (ansible_check_mode and (beszel_agent_run_podman_dir.msg | default('')) is search('failed to look up group'))

# /run is tmpfs — recreated from scratch on every boot, at which point
# podman.socket (not this role) creates /run/podman again with whatever
# mode it defaults to, undoing the fix above. A tmpfiles.d rule reapplies
# it automatically every boot, ordered by systemd to run before regular
# services (including podman.socket) start.
- name: Persist the Podman socket directory permissions across reboots
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/beszel-agent-podman.conf
    content: "z /run/podman 0755 root {{ beszel_agent_podman_group }} -\n"
    owner: root
    group: root
    mode: "0644"

- name: Fetch the Beszel release checksums
  ansible.builtin.uri:
    url: "https://github.com/henrygd/beszel/releases/download/v{{ beszel_agent_version }}/beszel_{{ beszel_agent_version }}_checksums.txt"
    return_content: true
  register: beszel_agent_checksums
  # Read-only GET: it must run under --check, or the checksum fact below has
  # nothing to parse.
  check_mode: false
  changed_when: false

- name: Determine this host's expected checksum
  ansible.builtin.set_fact:
    beszel_agent_checksum: >-
      {{ (beszel_agent_checksums.content.splitlines()
          | select('search', 'beszel-agent_linux_' ~ beszel_agent_arch ~ '\.tar\.gz$')
          | first).split()[0] }}

- name: Download and verify the Beszel agent archive
  ansible.builtin.get_url:
    url: "https://github.com/henrygd/beszel/releases/download/v{{ beszel_agent_version }}/beszel-agent_linux_{{ beszel_agent_arch }}.tar.gz"
    dest: "/tmp/beszel-agent_{{ beszel_agent_version }}_{{ beszel_agent_arch }}.tar.gz"
    checksum: "sha256:{{ beszel_agent_checksum }}"
    mode: "0644"

- name: Create the Beszel agent install directory
  ansible.builtin.file:
    path: "{{ beszel_agent_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Extract the Beszel agent binary
  ansible.builtin.unarchive:
    src: "/tmp/beszel-agent_{{ beszel_agent_version }}_{{ beszel_agent_arch }}.tar.gz"
    dest: "{{ beszel_agent_install_dir }}"
    remote_src: true
    creates: "{{ beszel_agent_bin_path }}"
  register: beszel_agent_unarchive
  # --check on a fresh host: the install directory was only simulated above.
  # Only that exact miss is tolerated, and only in check mode; a real run
  # still fails.
  failed_when:
    - beszel_agent_unarchive is failed
    - not (ansible_check_mode and (beszel_agent_unarchive.msg | default('')) is search('must be an existing dir'))

- name: Ensure the Beszel agent binary is executable
  ansible.builtin.file:
    path: "{{ beszel_agent_bin_path }}"
    owner: root
    group: root
    mode: "0755"
  register: beszel_agent_bin_perms
  # --check on a fresh host: the binary was only simulated being extracted.
  # Only that exact miss is tolerated, and only in check mode; a real run
  # still fails.
  failed_when:
    - beszel_agent_bin_perms is failed
    - not (ansible_check_mode and (beszel_agent_bin_perms.msg | default('')) is search('is absent, cannot continue'))

# Recent openSUSE Tumbleweed snapshots default to SELinux (targeted policy)
# — an unlabeled binary outside the package manager's usual paths fails to
# execute under a confined systemd service. Same tools/pattern as the samba
# role; see its README.md -> SELinux for the fuller explanation.
- name: Install SELinux management tools
  community.general.zypper:
    name:
      - policycoreutils-python-utils
      - python3-selinux
    state: present

- name: Re-gather the SELinux fact now that its Python bindings are installed
  ansible.builtin.setup:
    filter: ansible_selinux

- name: Set the SELinux file context for the Beszel agent binary
  community.general.sefcontext:
    target: "{{ beszel_agent_bin_path }}"
    setype: bin_t
    state: present
  when: ansible_facts.selinux.status == "enabled"
  register: beszel_agent_sefcontext
  # --check on a fresh host: python3-selinux is only simulated above. Only
  # that exact miss is tolerated, and only in check mode; a real run still
  # fails.
  failed_when:
    - beszel_agent_sefcontext is failed
    - not (ansible_check_mode and (beszel_agent_sefcontext.msg | default('')) is search('Failed to import the required Python library'))

- name: Apply the SELinux file context to the Beszel agent binary
  ansible.builtin.command: "restorecon -v {{ beszel_agent_bin_path }}"
  register: beszel_agent_restorecon
  changed_when: beszel_agent_restorecon.stdout != ''
  when: ansible_facts.selinux.status == "enabled"

- name: Deploy the Beszel agent systemd unit
  ansible.builtin.template:
    src: beszel-agent.service.j2
    dest: /etc/systemd/system/beszel-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart beszel-agent

- name: Enable and start the Beszel agent
  ansible.builtin.systemd:
    name: beszel-agent.service
    enabled: true
    state: started
    daemon_reload: true
  register: beszel_agent_service
  # --check on a fresh host: the unit file does not exist yet because the
  # template task above only simulated creating it. Only that exact miss is
  # tolerated, and only in check mode; a real run still fails.
  failed_when:
    - beszel_agent_service is failed
    - not (ansible_check_mode and (beszel_agent_service.msg | default('')) is search('Could not find the requested service'))

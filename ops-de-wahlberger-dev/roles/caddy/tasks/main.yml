---
# Input guards first: nothing below changes anything if one of them fails
# (SH-FR-193). `\A..\Z` anchors: a plain `$` would also accept a trailing newline.
- name: Require the ZeroTier bind address (vm_zt_ip) before anything is changed
  ansible.builtin.assert:
    that:
      - >-
        caddy_bind_address | default('', true) | string is match(
        '\A((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}'
        ~ '(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\Z')
      - caddy_bind_address | default('', true) | string != '0.0.0.0'
    fail_msg: >-
      vm_zt_ip is empty or not an IPv4 address (caddy_bind_address = vm_zt_ip; 0.0.0.0 is refused).
      Caddy listens only on the VM's ZeroTier address, so the caddy role refuses
      to run without it. Set vm_zt_ip in group_vars/all/vars.yml (pull request
      A2); see roles/caddy/README.md (SH-FR-193).
    quiet: true
  tags: [caddy, caddy_guard]

- name: Require a known design and a valid client allow list
  ansible.builtin.assert:
    that:
      - caddy_design in ['primary', 'bridge_fallback']
      - caddy_allowed_sources | length > 0
      - >-
        caddy_allowed_sources | map('string')
        | select('match', '\A[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?\Z')
        | list | length == caddy_allowed_sources | length
    fail_msg: >-
      caddy_design (from vm_proxy_design) must be primary or bridge_fallback,
      and caddy_allowed_sources must be a non-empty list of IPv4 CIDR ranges
      (an empty list would make the remote_ip matcher invalid).
    quiet: true
  tags: [caddy, caddy_guard]

- name: Validate the Cloudflare DNS API token is present
  ansible.builtin.assert:
    that:
      - cloudflare_dns_api_token | default('', true) | length > 0
    fail_msg: >-
      cloudflare_dns_api_token is empty. Provide the Vault secret
      vault_cloudflare_dns_api_token (run with --ask-vault-pass). See
      roles/caddy/README.md.
    quiet: true
  tags: [caddy]

- name: Create the Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ caddy_data_dir }}"
    - "{{ caddy_data_dir }}/data"
    - "{{ caddy_data_dir }}/config"
    - "{{ caddy_build_dir }}"

- name: Copy the Caddy Containerfile
  ansible.builtin.copy:
    src: Containerfile
    dest: "{{ caddy_build_dir }}/Containerfile"
    owner: root
    group: root
    mode: "0644"
  register: caddy_containerfile

# Builds a Caddy image with the Cloudflare DNS module baked in (see
# files/Containerfile) — the official image can't do DNS-01. `force` only
# triggers a real rebuild when the Containerfile changed; otherwise this is a
# no-op once the image already exists.
- name: Build the Caddy image with the Cloudflare DNS module
  containers.podman.podman_image:
    name: "{{ caddy_image }}"
    path: "{{ caddy_build_dir }}"
    state: build
    force: "{{ caddy_containerfile.changed }}"
  register: caddy_image_build
  notify: Restart caddy
  # --check on a fresh host: the Podman install was only simulated, so the
  # module cannot find the podman binary. Only that exact miss is tolerated,
  # and only in check mode; a real run still fails.
  failed_when:
    - caddy_image_build is failed
    - not (ansible_check_mode and (caddy_image_build.msg | default('')) is search('Failed to find required executable'))

# Only the bridge fallback uses caddy.network (shared with Semaphore, SH-FR-186);
# the primary design runs on host networking.
- name: Deploy the Caddy network Quadlet (bridge fallback only)
  ansible.builtin.template:
    src: caddy.network.j2
    dest: /etc/containers/systemd/caddy.network
    owner: root
    group: root
    mode: "0644"
  when: caddy_design == 'bridge_fallback'
  notify: Restart caddy

# Cloudflare token, rendered root-only so it never appears in the
# world-readable Quadlet unit or Caddyfile. Referenced from the Caddyfile as
# {env.CLOUDFLARE_API_TOKEN}.
- name: Render the Caddy environment file
  ansible.builtin.template:
    src: caddy.env.j2
    dest: "{{ caddy_data_dir }}/caddy.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart caddy

- name: Render the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_data_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: Restart caddy

- name: Deploy the Caddy container
  ansible.builtin.include_role:
    name: container
  vars:
    container_name: caddy
    container_quadlet_src: caddy.container.j2

---
argument_specs:
  main:
    short_description: Baseline OS configuration for openSUSE Tumbleweed hosts.
    description:
      - Refreshes zypper repositories, optionally runs a full update, installs
        a baseline package set, and sets the system timezone.
    options:
      common_packages:
        type: list
        elements: str
        required: false
        description: Baseline packages installed on every host.
      common_timezone:
        type: str
        required: false
        description: IANA timezone name to configure (for example Europe/Berlin).
      common_upgrade:
        type: bool
        required: false
        description: Whether to run a full zypper update.

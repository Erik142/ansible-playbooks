---
# VM fixture inventory (T-16): the disposable openSUSE Tumbleweed aarch64 qemu
# guest started by tests/vm/up.sh. One host in group `ops`, so the production
# group_vars structure applies. It is reached through qemu's port forward on
# 127.0.0.1:2223 with a throwaway key only; tests/vm/ans.sh refuses any other
# target. Never point this at the real ops VM, nas, cloud or pi.
all:
  children:
    ops:
      hosts:
        ops-vm-fixture:
          ansible_host: 127.0.0.1
          ansible_port: 2223
          ansible_ssh_private_key_file: >-
            {{ (lookup('env', 'FIXTURE_VM_DIR') | default(lookup('env', 'HOME') ~ '/.cache/ops-fixture-vm', true))
            ~ '/id_fixture' }}
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            -o IdentitiesOnly=yes

# HETZNER (local addition, not in upstream Minimal): pin the datasource so
# cloud-init does not probe every cloud. Hetzner supplies user-data (user,
# ssh key, sudo) through its own metadata service at server creation.
datasource_list: [ Hetzner, NoCloud, None ]

# Keys only; never allow password logins from cloud-init's side either.
ssh_pwauth: false

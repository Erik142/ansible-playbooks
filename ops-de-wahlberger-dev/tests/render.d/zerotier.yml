---
# Registers the zerotier Quadlet (T-02 walking skeleton). Role tasks add their
# own tests/render.d/NN-<name>.yml; see tests/lib/render.yml for the format.
render_items:
  - role: zerotier
    src: zerotier.container.j2
    dest: zerotier.container
    kind: quadlet
    asserts:
      - '^Network=host$'
      - '^Exec=8056c2e21cc5c789$'
  # The modules-load.d file must be exactly "tun": the container cannot load the
  # module itself under SELinux enforcing (see roles/zerotier/README.md). lookup(file)
  # strips the newline; tests/guards.d/zerotier_tun.yml checks the exact bytes.
  - role: zerotier
    src: zerotier-tun.conf.j2
    dest: zerotier-tun.conf
    kind: text
    asserts:
      - '\Atun\Z'

---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
    - role: notify_failure
    - role: disk_space
    - role: ssh_authorized_keys
    - role: security
    # NOT firewall: firewalld's nftables backend fails inside any container
    # (isolated network namespace); the zone binding is proven on the fixture
    # VM instead.
    # NOT reboot_notify, podman, zerotier, beszel_agent, cloudflare_dns,
    # caddy, semaphore, restic_backup: they need Podman (no nesting in the
    # container), real devices, external APIs or credentials.

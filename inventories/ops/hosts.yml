---
# Production inventory.
#
# This file holds only the host/group *structure*. All variables live in
# group_vars/. The inventory name is the host's public FQDN: common sets the system
# hostname from it, so it must stay ops.de.wahlberger.dev.
# Ansible connects over ZeroTier (ops.de.int.wahlberger.dev), so logins from the public
# address do not trigger ssh-login-notify mail. The ZeroTier range is on its ignore list.
all:
  children:
    ops:
      hosts:
        ops.de.wahlberger.dev:
          ansible_host: ops.de.int.wahlberger.dev

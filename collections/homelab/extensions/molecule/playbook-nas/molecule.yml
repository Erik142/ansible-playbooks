---
# Playbook scenario: the real nas.yml, restricted to the roles a container can run.
# Run from collections/homelab/extensions:  molecule test -s playbook-nas
# Skipped (need devices, Podman or real hosts): storage, smartd, backup_disk, snapper,
# podman, zerotier, beszel_agent, caddy, samba, tandoor, paperless_ngx, immich,
# forgejo, lab_grab, n8n, homepage, restic_server, db_dump, btrbk, garage, firewall.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/molecule/requirements.yml
driver:
  name: docker
platforms:
  - name: nas-instance
    image: homelab-molecule:tumbleweed
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /usr/lib/systemd/systemd
    groups:
      - nas
provisioner:
  name: ansible
  options:
    tags: common,notify_failure,disk_space,ssh_authorized_keys,security,reboot_notify,hush_recovery
    # Replaces molecule's default skip list, so keep molecule-notest and notest (container-only tasks).
    # Replaces molecule's default skip list, so keep molecule-notest and notest. `always`
    # stays allowed: the hush maintenance window open and close run through it.
    skip-tags: molecule-notest,notest
  playbooks:
    converge: ${MOLECULE_PROJECT_DIRECTORY}/../../../collections/ansible_collections/wahlberger/homelab/playbooks/nas.yml
  inventory:
    # Real non-secret group_vars, rendered by scripts/molecule-inventory.py (vault
    # values are a generated stub, never the encrypted vault.yml). Container-only
    # overrides live in this scenario's inventory/host_vars.
    links:
      group_vars: ${MOLECULE_PROJECT_DIRECTORY}/molecule/.generated/nas/group_vars
      host_vars: ${MOLECULE_SCENARIO_DIRECTORY}/inventory/host_vars
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../../collections:~/.ansible/collections
    ANSIBLE_VAULT_PASSWORD_FILE: ${MOLECULE_SCENARIO_DIRECTORY}/../base/inventory/dummy-vault-pass
    ANSIBLE_VAULT_IDENTITY_LIST: "lint@${MOLECULE_SCENARIO_DIRECTORY}/../base/inventory/dummy-vault-pass"
verifier:
  name: ansible
scenario:
  test_sequence:
    # Destroy first: a leftover instance record from an interrupted run would be reused.
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

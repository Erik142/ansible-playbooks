---
# Restart only units whose Quadlet is installed: the container role writes the
# unit files, and check mode writes none, so an early flush would find no unit.
# daemon_reload makes freshly written Quadlets visible to systemd.

- name: Check the lab-grab Quadlet is installed
  ansible.builtin.stat:
    path: /etc/containers/systemd/lab-grab.container
  register: lab_grab_stat_lab_grab
  listen: restart lab-grab

- name: Restart lab-grab if installed
  ansible.builtin.systemd:
    name: lab-grab.service
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - lab_grab_stat_lab_grab.stat.exists
  listen: restart lab-grab

- name: Check the lab-grab-db Quadlet is installed
  ansible.builtin.stat:

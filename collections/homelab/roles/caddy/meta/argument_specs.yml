---
argument_specs:
  main:
    short_description: Caddy reverse proxy with automatic HTTPS.
    options:
      caddy_acme_challenge:
        type: str
        required: false
        choices: ['dns', 'http']
        description: >-
          dns (default) issues certificates with DNS-01 via the Cloudflare module in
          caddy_image. http uses HTTP-01 on port 80 with caddy_http_image (no token, no build).
      caddy_http_image:
        type: str
        required: false
        description: Stock Caddy image used when caddy_acme_challenge is http.
      caddy_image:
        type: str
        required: false
        description: Locally built Caddy image tag (with the Cloudflare DNS module).
      caddy_data_dir:
        type: path
        required: false
        description: Host directory for the build context, Caddyfile, and Caddy state (certs).
      caddy_build_dir:
        type: path
        required: false
        description: Host directory holding the Containerfile build context.
      caddy_http_port:
        type: int
        required: false
        description: Host port mapped to the container's port 80.
      caddy_https_port:
        type: int
        required: false
        description: Host port mapped to the container's port 443.
      caddy_acme_email:
        type: str
        required: false
        description: Email for Let's Encrypt registration (optional).
      caddy_extra_networks:
        type: list
        elements: str
        required: false
        description: Quadlet network units (for example garage.network) the Caddy container joins in addition to caddy.network.
      caddy_host_network:
        type: bool
        required: false
        description: Run Caddy on the host network (client addresses visible, bind via caddy_bind_address). No caddy.network, no published ports.
      caddy_bind_address:
        type: str
        required: false
        description: IPv4 address Caddy listens on (default_bind). Empty leaves the default bind.
      caddy_allowed_sources:
        type: list
        elements: str
        required: false
        description: IPv4 CIDR ranges allowed to reach the sites; others get 403. Empty disables the gate.
      caddy_no_http_redirect:
        type: bool
        required: false
        description: Turn the admin endpoint off and disable the port-80 redirect listener.
      caddy_sites:
        type: list
        elements: dict
        required: false
        description: Sites to serve.
        options:
          host:
            type: str
            required: true
            description: Public hostname to serve.
          upstream:
            type: str
            required: false
            description: >-
              container_name:port to reverse_proxy to. Not allowed together with body.
              Without upstream, the site needs extra (for example an auth gate).
          extra:
            type: str
            required: false
            description: >-
              Optional raw Caddy directives appended to the generated site
              block. Not allowed together with body.
          body:
            type: str
            required: false
            description: >-
              Complete site block contents, rendered as "<host> { <body> }"
              with no generated reverse_proxy. Excludes upstream and extra.

# CI for pull requests and pushes to master. Tests the wahlberger.homelab collection
# (collections/homelab). CI never decrypts real secrets: a dummy vault password is used.
#
# Job graph:
#
#   changes ──┬─> molecule (matrix, one leg per scenario) ──┐
#             │   skipped when only docs/ or *.md changed    │
#             └─> lint ──────────────────────────────────────┤
#                 yamllint, ansible-lint, role coverage,     ├─> gate  (the required check)
#                 --syntax-check per host playbook,          │
#                 Ansible-Vault encryption check             │
#
#   gate fails if change detection or lint failed, or if code changed and a molecule
#   leg failed. It reports on every run, including docs-only changes.
#
# changes  decides whether anything outside docs/ and *.md changed.
# lint     scripts/lint.sh (the same script runs locally). Always runs.
# molecule scripts/molecule.sh <scenario> (the same script runs locally): converge,
#          idempotence, verify, and a fail on any ansible-core deprecation warning.
#          Scenarios live in collections/homelab/extensions/molecule.
# gate     the one check to require in branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          head='${{ github.sha }}'
          # A new branch pushes with an all-zero "before": run everything.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$head" | grep -vE '^(docs/|.*\.md$)' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI tooling
        run: pip install -r requirements-ci.txt

      - id: galaxy-cache
        uses: actions/cache@v6
        with:
          path: collections/ansible_collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('collections/homelab/galaxy.yml', 'requirements.yml') }}

      # Installs the collection (on cache miss), then yamllint, ansible-lint, the role
      # coverage check and --syntax-check for each host playbook.
      - name: Lint, coverage and syntax check
        run: scripts/lint.sh

      - name: Ensure every vault.yml is Ansible-Vault encrypted
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! head -c 15 "$f" | grep -q '^\$ANSIBLE_VAULT'; then
              echo "::error file=$f::not Ansible-Vault encrypted (plaintext secrets committed?)"
              status=1
            fi
          done < <(find . -type f -name 'vault.yml' -not -path './collections/ansible_collections/*' -print0)
          exit "$status"

  molecule:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [base, playbook-nas, playbook-ops, playbook-ci, playbook-edge]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI tooling
        run: pip install -r requirements-ci.txt

      - id: galaxy-cache
        uses: actions/cache@v6
        with:
          path: collections/ansible_collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('collections/homelab/galaxy.yml', 'requirements.yml', 'collections/homelab/extensions/molecule/requirements.yml') }}

      - name: Install collection requirements
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r requirements.yml -p collections --force

      # Test-only collections (community.docker for molecule's docker driver). Outside the
      # cache gate: a cache hit can restore a copy written without them.
      - name: Install molecule test collections
        run: ansible-galaxy collection install -r collections/homelab/extensions/molecule/requirements.yml -p collections --force

      # Layers are cached in GitHub's cache, so each leg rebuilds only what changed.
      - uses: docker/setup-buildx-action@v3

      - name: Build the shared test image
        uses: docker/build-push-action@v6
        with:
          context: collections/homelab/extensions/molecule/build
          tags: homelab-molecule:tumbleweed
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Renders the real non-secret group_vars, then runs the scenario. The same
      # script runs locally: scripts/molecule.sh <scenario>.
      - name: molecule test (${{ matrix.scenario }})
        run: |
          set -o pipefail
          scripts/molecule.sh ${{ matrix.scenario }} 2>&1 | tee molecule-output.log

      - name: Fail on any ansible-core deprecation warning
        run: |
          if grep -q '\[DEPRECATION WARNING\]' molecule-output.log; then
            echo "::error::ansible-core deprecation warning(s) found"
            grep '\[DEPRECATION WARNING\]' molecule-output.log
            exit 1
          fi

  gate:
    if: always()
    needs: [changes, lint, molecule]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, and every molecule leg when code changed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          MOLECULE: ${{ needs.molecule.result }}
        run: |
          echo "changes=$CHANGES code=$CODE lint=$LINT molecule=$MOLECULE"
          [ "$CHANGES" = success ] || { echo "::error::change detection did not run"; exit 1; }
          [ "$LINT" = success ] || { echo "::error::lint failed"; exit 1; }
          if [ "$CODE" = true ] && [ "$MOLECULE" != success ]; then
            echo "::error::a molecule scenario failed"
            exit 1
          fi

---
# All checks come first: nothing below changes the host until they pass.
- name: Validate the optional per-source keys (snapshot_dir, mount_path)
  ansible.builtin.import_tasks: validate.yml
  tags: [btrbk]

- name: Validate the snapshot directory name and sources
  ansible.builtin.assert:
    that:
      - btrbk_snapshot_dirname is match('^[^/]+$')
      - btrbk_snapshot_dirname != '.snapshots'
      - btrbk_sources | length > 0
      - >-
        btrbk_sources | map(attribute='path')
        | map('regex_replace', '/+$', '') | map('regex_replace', '$', '/' ~ btrbk_snapshot_dirname)
        | reject('match', '^' ~ (samba_data_dir | default('/mnt/data/samba') | regex_escape) ~ '(/|$)')
        | list | length == btrbk_sources | length
    fail_msg: >-
      btrbk_snapshot_dirname '{{ btrbk_snapshot_dirname }}' must be a single
      directory name, not '.snapshots' (snapper's), and btrbk_sources must not
      be empty (BD-FR-52, BD-FR-53).
    quiet: true
  tags: [btrbk]

# BD-BR-04 paths: the target and every source (for an entry with `mount_path`,
# that mount point instead of the nested subvolume path). Computed once for the guard,
# the unit's RequiresMountsFor= and the directories below.
- name: Collect the paths that must be mounted
  ansible.builtin.set_fact:
    btrbk_mount_paths: >-
      {{ ([btrbk_target_dir]
          + (btrbk_sources | selectattr('mount_path', 'undefined') | map(attribute='path') | list)
          + (btrbk_sources | selectattr('mount_path', 'defined') | map(attribute='mount_path') | list))
         | map('regex_replace', '(.)/+$', '\1') | unique | list }}
  tags: [btrbk]

# Reads the live mount table (BD-FR-25), not facts gathered at play start.
- name: Read the live mount table entry for every path
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --raw
      - --output
      - UUID,FSROOT
      - --mountpoint
      - "{{ item }}"
  loop: "{{ btrbk_mount_paths }}"
  register: btrbk_findmnt
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [btrbk]

# For a path listed in storage_mounts the filesystem UUID and subvolume must
# match too; the target is matched on its subvolume (backup_disk_mounts).
- name: Fail before any change when a path is not mounted from the expected filesystem
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim | length > 0
      - >-
        (btrbk_expected | length == 0) or
        (item.stdout | trim | split(' ') | last == btrbk_expected.subvol)
      - >-
        (btrbk_expected.uuid | default('') | length == 0) or
        (item.stdout | trim | split(' ') | first == btrbk_expected.uuid)
    fail_msg: >-
      {{ item.item }} is not mounted from the expected filesystem
      (findmnt: {{ item.stdout | default('') | trim | default('not mounted', true) }};
      expected {{ btrbk_expected | default({}) }}). Mount it (storage or
      backup_disk role) before running btrbk.
    quiet: true
  vars:
    btrbk_expected: >-
      {{ ((storage_mounts | default([])) + (backup_disk_mounts | default([])))
         | selectattr('path', 'equalto', item.item) | first | default({}) }}
  loop: "{{ btrbk_findmnt.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [btrbk]

# Entries with `mount_path` (GS-FR-75, GS-FR-76): the source path is a nested
# subvolume, not a mount point. `btrfs subvolume show` fails when it is absent
# or a plain directory; nothing is created.
- name: Check that every source below a mount_path is an existing btrfs subvolume
  ansible.builtin.command:
    argv:
      - btrfs
      - subvolume
      - show
      - "{{ item.path }}"
  loop: "{{ btrbk_sources | selectattr('mount_path', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: btrbk_subvol
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [btrbk]

- name: Fail before any change when a source path is not a btrfs subvolume
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      btrbk_sources entry '{{ item.item.name }}': path '{{ item.item.path }}'
      does not exist or is not a btrfs subvolume ({{ item.stderr | default('') | trim }}).
      The role never creates it (GS-FR-76, GS-BR-04).
    quiet: true
  loop: "{{ btrbk_subvol.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags: [btrbk]

# GS-FR-92: the snapshot directory must be on the same filesystem mount as the
# source, else btrbk cannot make a snapshot there.
- name: Read the mount target of each source path that has a snapshot_dir
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --output, TARGET, --target, "{{ item.path }}"]
  loop: "{{ btrbk_sources | selectattr('snapshot_dir', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: btrbk_src_target
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [btrbk]

- name: Read the mount target of the parent of each snapshot_dir
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --output, TARGET, --target, "{{ item.snapshot_dir | regex_replace('(.)/+$', '\\1') | dirname }}"]
  loop: "{{ btrbk_sources | selectattr('snapshot_dir', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: btrbk_sd_target
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [btrbk]

- name: Fail before any change when a snapshot_dir is on another mount than its source
  ansible.builtin.assert:
    that:
      - item.0.rc == 0
      - item.1.rc == 0
      - item.0.stdout | trim | length > 0
      - item.0.stdout | trim == item.1.stdout | trim
    fail_msg: >-
      btrbk_sources entry '{{ item.0.item.name }}': snapshot_dir
      '{{ item.0.item.snapshot_dir }}' must be on the same mount as path
      '{{ item.0.item.path }}' (findmnt: source on '{{ item.0.stdout | trim }}',
      snapshot_dir parent on '{{ item.1.stdout | trim }}') (GS-FR-92).
    quiet: true
  loop: "{{ btrbk_src_target.results | zip(btrbk_sd_target.results) | list }}"
  loop_control:
    label: "{{ item.0.item.name }}"
  tags: [btrbk]

- name: Install btrbk from the pinned repository
  ansible.builtin.import_tasks: install.yml
  tags: [btrbk]

- name: Configure btrbk and its units
  ansible.builtin.import_tasks: config.yml
  tags: [btrbk]

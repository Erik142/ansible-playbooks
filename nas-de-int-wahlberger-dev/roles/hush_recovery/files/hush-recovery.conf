# Deployed by Ansible (roles/hush_recovery). Do NOT edit on the host; re-run Ansible.
# Recovery signal to Hush: posts "ok" each time the unit reports ready (Type=notify
# or simple, after start). OnFailure= (notify-failure@) still posts "problem".
[Service]
EnvironmentFile=/etc/hush/hook.env
# "-": a failed post must not fail the unit (Restart=always would crash-loop it).
# "+": run as root, whatever User= the unit uses. The token is root-only, as for the
# problem hook (hush-notify@ runs as root).
ExecStartPost=-+/usr/local/bin/hush-systemd-event ok %n

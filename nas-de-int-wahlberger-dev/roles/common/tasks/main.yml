---
- name: Refresh repositories and upgrade all packages
  community.general.zypper:
    name: "*"
    state: latest
    update_cache: true
  when: common_upgrade | bool

- name: Install baseline packages
  community.general.zypper:
    name: "{{ common_packages }}"
    state: present

- name: Set the system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

# journald only auto-switches from volatile (/run/log/journal, wiped every
# reboot) to persistent storage if this exact directory exists — no config
# file needed. Proper disk here, so the continuous writes this causes
# aren't a wear concern (unlike pi-de-int-wahlberger-dev's SD card — see
# that repo's journal_archive role for the different approach taken there).
- name: Enable persistent systemd journal storage
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Restart systemd-journald

# inventory_hostname is already this host's real FQDN (matches ansible.cfg's
# inventory file) — no new variable needed. Fixes cases like a VM's hostname
# having been left at whatever the provisioning process set it to (seen
# firsthand on cloud-wahlberger-dev: a notify_failure email tagged a log
# line "cloud-podman", not "cloud.wahlberger.dev").
- name: Set the system hostname to the host's FQDN
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# A static fallback for resolving this host's own hostname, so `sudo`
# doesn't print "unable to resolve host" if DNS is ever briefly unavailable
# — not a replacement for the real public DNS record (cloudflare_dns role)
# this host already has. The real IP, not 127.0.1.1: Podman's default
# base_hosts_file behavior copies the host's /etc/hosts into every
# container it creates, and a loopback entry means something INSIDE a
# container that resolves this host's own FQDN gets the container's own
# loopback, not the host's — broke pi-de-int-wahlberger-dev's Semaphore
# (which runs as a container) SSHing to its own inventory entry; fixed
# here too so no container on this host can hit the same trap.
- name: Ensure /etc/hosts resolves this host's own hostname locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '(^|\s){{ inventory_hostname }}(\s|$)'
    line: "{{ ansible_facts.default_ipv4.address }}\t{{ inventory_hostname }}\t{{ inventory_hostname.split('.')[0] }}"
    create: true
    mode: "0644"

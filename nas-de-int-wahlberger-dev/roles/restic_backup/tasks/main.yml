---
- name: Validate restic_backup inputs are present
  ansible.builtin.assert:
    that:
      - restic_backup_repo_password | length > 0
      - restic_backup_rest_server_password | length > 0
    fail_msg: >-
      restic_backup_repo_password or restic_backup_rest_server_password is
      empty. Set vault_restic_backup_repo_password and
      vault_restic_backup_rest_server_password in Ansible Vault — the latter
      must match pi-de-int-wahlberger-dev's
      vault_restic_server_htpasswd_password exactly. See README.md.
    quiet: true

- name: Install restic
  community.general.zypper:
    name: restic
    state: present

- name: Create the backup staging directory
  ansible.builtin.file:
    path: "{{ restic_backup_staging_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render the Postgres auth file for pg_dump
  ansible.builtin.template:
    src: pgpass.env.j2
    dest: "{{ restic_backup_staging_dir }}/pgpass.env"
    owner: root
    group: root
    mode: "0600"

- name: Render the restic environment file
  ansible.builtin.template:
    src: restic-backup.env.j2
    dest: "{{ restic_backup_staging_dir }}/restic-backup.env"
    owner: root
    group: root
    mode: "0600"

- name: Create the restic_backup config directory
  ansible.builtin.file:
    path: /etc/restic-backup
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the success email HTML template
  ansible.builtin.copy:
    src: success-email-template.html
    dest: /etc/restic-backup/success-email-template.html
    owner: root
    group: root
    mode: "0644"

- name: Deploy the backup script
  ansible.builtin.template:
    src: restic-backup.sh.j2
    dest: /usr/local/bin/restic-backup.sh
    owner: root
    group: root
    mode: "0700"

- name: Deploy the systemd service unit
  ansible.builtin.template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    owner: root
    group: root
    mode: "0644"

- name: Deploy the systemd timer unit
  ansible.builtin.template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable and start the backup timer
  ansible.builtin.systemd:
    name: restic-backup.timer
    enabled: true
    state: started
    daemon_reload: true

---
# daemon_reload: true matters here — on a first-ever run these handlers can
# run BEFORE the container role's own restart handler for the matching
# service (Ansible runs flushed handlers in definition order, not
# notification order, and this role's handlers are statically defined while
# container's is only registered when its dynamic include_role actually
# executes). Without a reload, systemd doesn't know the unit exists yet
# (Podman Quadlet units are generated on daemon-reload), so the restart fails
# with "Could not find the requested service". Making these handlers
# self-sufficient avoids depending on ordering. See also roles/paperless_ngx's.
- name: Restart immich-postgres
  ansible.builtin.systemd:
    name: immich-postgres.service
    state: restarted
    daemon_reload: true

- name: Restart immich-server
  ansible.builtin.systemd:
    name: immich-server.service
    state: restarted
    daemon_reload: true

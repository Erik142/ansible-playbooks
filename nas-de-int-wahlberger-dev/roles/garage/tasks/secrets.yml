---
# Stage 3: the two secret files, outside every snapshot (GS-FR-20, GS-FR-21,
# GS-FR-133, GS-FR-134). The guard runs first and fails before any change
# (GS-E-32). Every task that handles a secret value sets no_log: true.

# Prints one line per btrbk source or snapper subvolume that has the same btrfs
# root ID as garage_secrets_dir (or its nearest existing parent). Prints
# nothing when the path is not on btrfs or nothing covers it.
- name: Find btrbk sources and snapper configs that cover the secrets directory (GS-FR-134)
  ansible.builtin.command:
    argv: "{{ ['bash', '-c', garage_secrets_guard_script, 'guard', garage_secrets_dir] + (btrbk_sources | default([]) | map(attribute='path') | list) }}"
  vars:
    garage_secrets_guard_script: |
      set -o pipefail
      target=$1; shift
      probe=$target
      while [ ! -e "$probe" ]; do probe=$(dirname "$probe"); done
      [ "$(findmnt -no FSTYPE -T "$probe")" = btrfs ] || exit 0
      want=$(btrfs inspect-internal rootid "$probe")
      for src in "$@"; do
        [ -e "$src" ] || continue
        id=$(btrfs inspect-internal rootid "$src")
        [ "$id" = "$want" ] && echo "btrbk source $src (root ID $id)"
      done
      if command -v snapper >/dev/null 2>&1; then
        snapper list-configs | awk -F'|' 'NR > 2 { gsub(/^ +| +$/, "", $1); gsub(/^ +| +$/, "", $2); print $1 "\t" $2 }' |
        while IFS=$'\t' read -r cfg sub; do
          [ -e "$sub" ] || continue
          id=$(btrfs inspect-internal rootid "$sub")
          [ "$id" = "$want" ] && echo "snapper config $cfg ($sub, root ID $id)"
        done
      fi
      exit 0
  register: garage_secrets_cover
  changed_when: false
  check_mode: false

- name: Fail when a snapshot config covers the secrets directory (GS-E-32)
  ansible.builtin.fail:
    msg: >-
      {{ garage_secrets_dir }} is covered by {{ garage_secrets_cover.stdout_lines | join('; ') }}.
      Secrets would end up in snapshots. Nothing was changed; point garage_secrets_dir
      at a path on a subvolume that no btrbk source and no snapper config covers
      (default /var/lib/garage/secrets).
  when: garage_secrets_cover.stdout_lines | length > 0

- name: Stat the parent of the secrets directory
  ansible.builtin.stat:
    path: "{{ garage_secrets_dir | dirname }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: garage_secrets_parent

- name: Create the parent of the secrets directory when it is missing
  ansible.builtin.file:
    path: "{{ garage_secrets_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not garage_secrets_parent.stat.exists

- name: Create the secrets directory
  ansible.builtin.file:
    path: "{{ garage_secrets_dir }}"
    state: directory
    owner: root
    group: "{{ garage_user }}"
    mode: "0750"

- name: Write the RPC secret
  ansible.builtin.copy:
    dest: "{{ garage_secrets_dir }}/rpc_secret"
    content: "{{ garage_rpc_secret }}"
    owner: "{{ garage_user }}"
    group: "{{ garage_user }}"
    mode: "0400"
  no_log: true

- name: Write the admin token
  ansible.builtin.copy:
    dest: "{{ garage_secrets_dir }}/admin_token"
    content: "{{ garage_admin_token }}"
    owner: "{{ garage_user }}"
    group: "{{ garage_user }}"
    mode: "0400"
  no_log: true

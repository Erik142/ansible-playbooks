---
# Stage 3: the two secret files, outside every snapshot (GS-FR-20, GS-FR-21,
# GS-FR-133, GS-FR-134). The GS-E-32 guard lives in secrets_guard.yml, before the first
# change of the role. Every task that handles a secret value sets no_log: true.

- name: Stat the parent of the secrets directory
  ansible.builtin.stat:
    path: "{{ garage_secrets_dir | dirname }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: garage_secrets_parent

- name: Create the parent of the secrets directory when it is missing
  ansible.builtin.file:
    path: "{{ garage_secrets_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not garage_secrets_parent.stat.exists

- name: Create the secrets directory
  ansible.builtin.file:
    path: "{{ garage_secrets_dir }}"
    state: directory
    owner: root
    group: "{{ garage_user }}"
    mode: "0750"

- name: Write the RPC secret
  ansible.builtin.copy:
    dest: "{{ garage_secrets_dir }}/rpc_secret"
    content: "{{ garage_rpc_secret }}"
    owner: "{{ garage_user }}"
    group: "{{ garage_user }}"
    mode: "0400"
  no_log: true
  notify: Restart garage

- name: Write the admin token
  ansible.builtin.copy:
    dest: "{{ garage_secrets_dir }}/admin_token"
    content: "{{ garage_admin_token }}"
    owner: "{{ garage_user }}"
    group: "{{ garage_user }}"
    mode: "0400"
  no_log: true
  notify: Restart garage

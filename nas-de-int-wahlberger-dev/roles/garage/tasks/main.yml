---
# Stage files, imported statically and in this order. Each later task edits
# only its own stage file (PLAN-garage.md, "Role file ownership").
- name: Validate inputs and refuse to run without the backup disk
  ansible.builtin.import_tasks: preflight.yml

- name: Create the account, subvolumes and directories
  ansible.builtin.import_tasks: storage.yml

- name: Write the secret files
  ansible.builtin.import_tasks: secrets.yml

- name: Deploy garage.toml and the Quadlet
  ansible.builtin.import_tasks: deploy.yml

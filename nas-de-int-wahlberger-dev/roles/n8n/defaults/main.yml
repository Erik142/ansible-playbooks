---
# Default variables for the `n8n` role. Every variable here is declared in
# meta/argument_specs.yml.
#
# n8n workflow automation, phase 1 of architecture/ai-incident-remediation-pipeline.md:
# the editor only, no workflows. Editor access goes through oauth2-proxy + Pocket ID
# (forward_auth in the Caddy vhost); the /webhook/hush path bypasses it and is
# authenticated by HMAC in the workflow itself (phase 2).

# Pinned exact tag. Stable line per the n8n changelog (2.47.4, 2026-11-23).
# Do not use `latest`. Renovate proposes minor/patch bumps; majors stay manual.
n8n_image: docker.io/n8nio/n8n:3.3.0

# Host layout under /mnt/containers (restic/btrbk-covered like the other containers):
#   <n8n_data_dir>/n8n.env            root-only env file (encryption key)
#   <n8n_data_dir>/oauth2-proxy.env   root-only env file (OIDC client secret, cookie secret)
#   <n8n_volume_dir>/                 mounted at /home/node/.n8n (SQLite DB, credentials, settings)
n8n_data_dir: /mnt/containers/n8n
n8n_volume_dir: "{{ n8n_data_dir }}/data"

# uid/gid the n8n image runs as (node). The volume must be owned by it, since
# rootful Podman does no ID remapping.
n8n_uid: 1000
n8n_gid: 1000

n8n_timezone: Europe/Berlin
n8n_port: 5678

# REQUIRED: public https:// URL, set in group_vars. Must match the caddy_sites host.
# Also the base of the Pocket ID redirect URI.
n8n_url: ""

# Caps from the phase 1 plan (NAS: 23 GiB RAM, 4 cores, ~18 GiB free).
n8n_memory_max: 2G
n8n_cpu_quota: 200%

# Node types that must never run. executeCommand would give a workflow a shell
# on the NAS. Documented by n8n as NODES_EXCLUDE.
n8n_nodes_exclude: '["n8n-nodes-base.executeCommand"]'

# --- oauth2-proxy (editor auth gate, same pattern as cloud-wahlberger-dev/uptime_kuma)
n8n_oauth2_proxy_image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
n8n_oauth2_proxy_port: 4180

# Pocket ID OIDC client for the editor. Not secret (a UUID). Create it in Pocket ID
# with redirect URI "{{ n8n_url }}/oauth2/callback", then set it in group_vars.
n8n_oidc_client_id: ""

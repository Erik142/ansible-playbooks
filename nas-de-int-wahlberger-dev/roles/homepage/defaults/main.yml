---
# Default variables for the `homepage` role.

homepage_image: ghcr.io/gethomepage/homepage:v2.2.0

homepage_data_dir: /mnt/containers/homepage

homepage_title: "wahlberger.dev"

# REQUIRED: public https:// URL Homepage is served on (set in group_vars).
# Homepage (a Next.js app) refuses requests for hosts not in this list — the
# scheme is stripped from this value for HOMEPAGE_ALLOWED_HOSTS.
homepage_url: ""

# Cross-playbook links to cloud-wahlberger-dev's services. rpi-karlsruhe is
# intentionally excluded — it's being retired, see the top-level README.
# Reuses pocket_id_app_url (already defined for mealie/paperless_ngx's OIDC)
# rather than duplicating the URL under a new name.
homepage_pocket_id_url: "{{ pocket_id_app_url }}"
homepage_freshrss_url: "https://rss.wahlberger.dev"

# TrueNAS instance in Sweden (a separate physical host, not managed by any
# playbook in this repo), reachable over ZeroTier.
homepage_truenas_url: "https://truenas.boras.int.wahlberger.dev"

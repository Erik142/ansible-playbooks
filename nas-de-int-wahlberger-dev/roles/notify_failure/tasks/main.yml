---
- name: Validate notify_failure inputs are present
  ansible.builtin.assert:
    that:
      - notify_failure_resend_api_key | length > 0
      - notify_failure_hush_token | length > 0
    fail_msg: >-
      notify_failure_resend_api_key or notify_failure_hush_token is empty. Set
      vault_notify_failure_resend_api_key and the host's vault_hush_source_hooks_* in Ansible Vault.
    quiet: true
  no_log: true

- name: Install jq
  community.general.zypper:
    name: jq
    state: present

- name: Create the notify_failure config directory
  ansible.builtin.file:
    path: /etc/notify-failure
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the notify_failure environment file
  ansible.builtin.template:
    src: notify-failure.env.j2
    dest: /etc/notify-failure/notify-failure.env
    owner: root
    group: root
    mode: "0600"

- name: Deploy the email HTML template
  ansible.builtin.copy:
    src: email-template.html
    dest: /etc/notify-failure/email-template.html
    owner: root
    group: root
    mode: "0644"

- name: Deploy the notification script
  ansible.builtin.template:
    src: notify-failure.sh.j2
    dest: /usr/local/bin/notify-failure.sh
    owner: root
    group: root
    mode: "0700"

- name: Deploy the hush-post helper
  ansible.builtin.template:
    src: hush-post.sh.j2
    dest: /usr/local/bin/hush-post
    owner: root
    group: root
    mode: "0700"

- name: Deploy the notify-failure@.service template unit
  ansible.builtin.template:
    src: "notify-failure@.service.j2"
    dest: /etc/systemd/system/notify-failure@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy the notify-failure-immediate@.service template unit
  ansible.builtin.template:
    src: "notify-failure-immediate@.service.j2"
    dest: /etc/systemd/system/notify-failure-immediate@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

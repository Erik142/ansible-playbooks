---
# Galaxy content this playbook depends on. Install before the first run:
#
#   ansible-galaxy collection install -r requirements.yml
#
# Versions are pinned with a floor (">=") so installs are reproducible but can
# still pick up patch/minor fixes. Bump deliberately.
collections:
  # zypper / zypper_repository / timezone modules, used by common/podman/firewall.
  - name: community.general
    version: ">=8.0.0"

  # profile_tasks callback wired up in ansible.cfg, plus the firewalld module
  # used by the firewall role.
  - name: ansible.posix
    version: ">=1.5.0"

  # podman_network module, used by the paperless_ngx role to isolate its
  # redis/postgres backend on their own network.
  - name: containers.podman
    version: ">=1.16.0"

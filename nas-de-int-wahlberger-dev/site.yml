---
# Top-level playbook. Convention: `site.yml` applies the *entire* configuration
# to every host. As the stack grows, split concerns into per-tier playbooks and
# pull them together here with `import_playbook:`.
#
# Run with:  ansible-playbook site.yml
# Limit to one role:  ansible-playbook site.yml --tags samba
- name: Configure the nas.de.int.wahlberger.dev host
  hosts: nas
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common]
    # Early: other roles' units (e.g. btrbk, db_dump) hook OnFailure= into
    # the unit this role deploys.
    - role: notify_failure
      tags: [notify_failure]
    # Periodic disk usage check, emailing via notify_failure — the only
    # thing in this stack that watches disk space at all.
    - role: disk_space
      tags: [disk_space]
    # Personal + Semaphore automation SSH keys, authorized before hardening.
    - role: ssh_authorized_keys
      tags: [ssh_authorized_keys]
    # Harden the host before anything else listens on the network.
    - role: security
      tags: [security]
    # After notify_failure (reuses its Resend credentials). security's own
    # request-reboot-if-needed.sh calls this role's reboot-notify.sh
    # directly (see roles/reboot_notify/README.md) — order between the two
    # roles here doesn't matter beyond that, since both just need to exist
    # by the time any real automated patch cycle actually runs.
    - role: reboot_notify
      tags: [reboot_notify]
    - role: firewall
      tags: [firewall]
    # Before podman/samba: both assert their data directories are already
    # mounted.
    - role: storage
      tags: [storage]
    # smartd + mail hook, monitoring the main data HDD. After notify_failure
    # (hook reuses its Resend credentials); before backup_disk, which only adds
    # its own device line. Not gated: the main disk is monitored from day one.
    - role: smartd
      tags: [smartd]
    # Backup disk (mount, SMART, scrub, health check). After storage; before
    # snapper. Off until runbook step 3 (backup_disk_enabled in vars.yml), so
    # a merged site.yml does not fail on the not-yet-initialised disk.
    - role: backup_disk
      tags: [backup_disk]
      when: backup_disk_enabled | bool
    # After storage: needs the subvolumes actually mounted to verify their
    # .snapshots directories.
    - role: snapper
      tags: [snapper]
    - role: podman
      tags: [podman]
    # Reports to beszel_hub on cloud-wahlberger-dev. After podman: needs its
    # rootful API socket to already exist to grant this agent access to it.
    - role: beszel_agent
      tags: [beszel_agent]
    # Ensure this host's public DNS records exist before Caddy needs them.
    - role: cloudflare_dns
      tags: [cloudflare_dns]
    # Reverse proxy (creates the shared network) for tandoor/paperless-ngx/immich/forgejo.
    - role: caddy
      tags: [caddy]
    # Native Samba file server (not a container) with guest access.
    - role: samba
      tags: [samba]
    # Idempotent teardown of the old Mealie unit/container, superseded by
    # tandoor below. Order vs. tandoor doesn't matter — neither publishes a
    # host port, so there's no clash either way. See
    # roles/mealie_decommission/README.md.
    - role: mealie_decommission
      tags: [mealie_decommission]
    - role: tandoor
      tags: [tandoor]
    # After samba: its inbox directory lives inside the Samba share.
    - role: paperless_ngx
      tags: [paperless_ngx]
    # Photo/video backup. After samba: its library/import directories live
    # inside the Samba share.
    - role: immich
      tags: [immich]
    # Git forge + OCI registry (SQLite). After caddy (shared network) and
    # before db_dump, which dumps its database.
    - role: forgejo
      tags: [forgejo]
    # Dashboard linking this NAS's and cloud-wahlberger-dev's services.
    - role: homepage
      tags: [homepage]
    # restic REST server for cloud-wahlberger-dev's backups (host networking,
    # gated by the firewall role's rich rules). After firewall, podman and
    # storage (needs /mnt/data mounted). Gated with the backup disk: its
    # repositories are only protected by btrbk once that disk exists.
    - role: restic_server
      tags: [restic_server]
      when: backup_disk_enabled | bool
    # Database dumps (Postgres containers + Forgejo SQLite) for btrbk to
    # snapshot. After paperless_ngx, immich, tandoor, forgejo and homepage,
    # whose containers and passwords it needs. Gated with the backup disk.
    - role: db_dump
      tags: [db_dump]
      when: backup_disk_enabled | bool
    # After db_dump (snapshots its output) and backup_disk (target mount).
    - role: btrbk
      tags: [btrbk]
      when: backup_disk_enabled | bool
    # Removes the old NAS-to-Pi restic job (timer, service, script, state).
    # Separate flag, set only at runbook step 5; the job keeps running until
    # then. Depends on no other flag.
    - role: restic_backup_decommission
      tags: [restic_backup_decommission]
      when: restic_backup_decommission_enabled | bool

# Safe ansible config for runs against the VM fixture only (use via ans.sh).
# Deliberately no production inventory, no vault_password_file (that script
# would call 1Password) and no fact cache.
[defaults]
inventory = ../../inventories/vm,inventory.yml
roles_path = ../../roles
interpreter_python = auto_silent
host_key_checking = false
retry_files_enabled = false
gathering = smart
[ssh_connection]
pipelining = true

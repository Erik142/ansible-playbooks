# Minimal hand-written btrbk configuration for the render-check smoke test.
# Exercises the harness (render -> `btrbk config print`) before any role
# ships a real btrbk template; same retention shape as the production design.
timestamp_format        long
snapshot_preserve_min   2d
snapshot_preserve       no
target_preserve_min     no
target_preserve         14d 8w 12m 3y

volume /mnt/data
  snapshot_dir .btrbk
  target /mnt/backup/btrbk/data
  subvolume .

---
# Variables applied to every host in the production inventory.
#
# group_vars/all/ is a *directory* (not a single file) on purpose: it lets a
# plaintext `vars.yml` sit next to an encrypted `vault.yml`, so secrets and
# non-secrets live side by side without mixing.

# --- Connection -------------------------------------------------------------
# SSH login user. Privilege escalation (become) is turned on in site.yml.
ansible_user: erikwahlberger

# --- Hardening (security role) -----------------------------------------------
# These mirror the role's secure defaults, set explicitly so the security
# posture is auditable in one place.
security_ssh_permit_root_login: "no"
security_ssh_password_authentication: "no"
security_fail2ban_enabled: true
security_autoupdate_enabled: true
# Reboot automatically (via rebootmgr) for updates that need it (kernel,
# glibc, …) — the reboot_notify role emails a heads-up right before it
# happens, gated on `zypper needs-rebooting` so it only fires for a genuine
# update-triggered reboot. See roles/security/README.md.
security_autoupdate_reboot: true
# Passwordless sudo for Semaphore UI's unattended playbook runs (see
# pi-de-int-wahlberger-dev).
security_sudoers_passwordless:
  - erikwahlberger

# --- SSH access (ssh_authorized_keys role) ----------------------------------
# Your personal key (manual access) plus Semaphore UI's dedicated automation
# key (pi-de-int-wahlberger-dev), kept separate on purpose — see
# roles/ssh_authorized_keys/README.md. Neither is secret (public keys), so
# both live here in plaintext, not Vault. The SAME two keys are authorized on
# cloud-wahlberger-dev, the NAS, and the Pi.
ssh_authorized_keys_list:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJSKdeHoK+WkyBI69OSZqn0sVqZPPDRs082S/IVoOeSu erikwahlberger@personal"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMixf1vPbDUankXYuMO0bJFXjQ+Cmh3QsrwC6TzGPkda semaphore-automation@pi.de.int.wahlberger.dev"

# --- Disk space check (disk_space role) --------------------------------------
# This host's two separately mounted disks (see the top-level README's "Data
# & secrets"), plus the root filesystem the role already defaults to.
disk_space_paths:
  - /
  - /mnt/data
  - /mnt/containers
  - /mnt/backup/btrbk

# --- Backup disk (backup_disk, db_dump, btrbk roles) -------------------------
# Enabled in runbook step 3 (backup disk initialised, backup_disk_uuid set);
# gates backup_disk, db_dump and btrbk in site.yml.
backup_disk_enabled: true
# Filesystem UUID printed by backup_disk_init.yml (runbook step 3). The
# backup_disk role fails with a pointer to its README while this is empty.
backup_disk_uuid: "80cb7856-915a-42de-b56d-431d17606b70"
# Newest direct child of each path must be younger than max_age_hours.
backup_disk_freshness_checks:
  - path: /mnt/backup/btrbk/data
    max_age_hours: 26
  - path: /mnt/backup/btrbk/containers
    max_age_hours: 26
  - path: /mnt/data/restic-repos/cloud/snapshots
    max_age_hours: 26

# Removes the old NAS-to-Pi restic job from step 5 of the runbook; the old
# job is removed from that step on and keeps running until then.
restic_backup_decommission_enabled: true

# --- Firewall -----------------------------------------------------------------
# Beszel's hub (cloud-wahlberger-dev) connects to this host's beszel_agent
# over the ZeroTier-routed home LAN — must match beszel_agent_port.
firewall_allowed_ports:
  - "45876/tcp"
  # Forgejo's git-over-SSH (forgejo_ssh_port); the host's own sshd stays on
  # 22. This host has no public inbound port, so this is reachable from the
  # LAN/ZeroTier only. Must match forgejo_ssh_port.
  - "2222/tcp"

# --- restic REST server (restic_server role) ---------------------------------
# Sources allowed to reach the rest-server: the home LAN (10.10.0.0/16) and
# ZeroTier (10.243.0.0/16). firewall_rich_rules below opens restic_server_port
# for exactly these; that port must equal restic_server_port (8000), and 8000/tcp
# stays out of firewall_allowed_ports.
restic_server_allowed_sources:
  - "10.10.0.0/16"
  - "10.243.0.0/16"
# Ungated on purpose (BD-D-06): the rules exist before anything listens.
firewall_rich_rules: >-
  {{ restic_server_allowed_sources
  | map('regex_replace', '^(.*)$', 'rule family="ipv4" source address="\1" port port="' ~ restic_server_port ~ '" protocol="tcp" accept')
  | list }}

# --- Reverse proxy (caddy role) ----------------------------------------------
# DNS-01 via Cloudflare (not HTTP-01): this host has no public inbound port,
# so certificates are issued via a Cloudflare DNS API token instead. See
# roles/caddy/README.md.
caddy_acme_email: "ewahlberger@gmail.com"
caddy_sites:
  - host: recipes.de.int.wahlberger.dev
    upstream: "tandoor:80"
    extra: |
      @setup path /setup /setup/*
      respond @setup 404
  - host: docs.de.int.wahlberger.dev
    upstream: "paperless-ngx:8000"
  - host: photos.de.int.wahlberger.dev
    upstream: "immich-server:2283"
  # Forgejo web UI + OCI registry (/v2/) on one vhost. Caddy applies no
  # request-body size limit and no upstream timeouts by default, so large
  # image layer uploads pass through unchanged.
  - host: git.de.int.wahlberger.dev
    upstream: "forgejo:3000"
  - host: www.de.int.wahlberger.dev
    upstream: "homepage:3000"

# --- Identity provider (Pocket ID) -------------------------------------------
# Public issuer URL of the Pocket ID instance (served by cloud-wahlberger-dev)
# that tandoor and paperless-ngx authenticate against. The OIDC discovery
# document is derived from it as "{{ pocket_id_app_url }}/.well-known/openid-configuration".
pocket_id_app_url: "https://id.wahlberger.dev"

# --- Paperless-ngx ------------------------------------------------------------
# This replaces the rpi-karlsruhe paperless-ngx instance at the SAME hostname —
# reuse the OIDC client already registered in Pocket ID for
# https://docs.de.int.wahlberger.dev/accounts/oidc/pocketid/login/callback/
# (same client_id, same vault_paperless_ngx_oidc_client_secret value) rather than
# registering a new app.
paperless_ngx_url: "https://docs.de.int.wahlberger.dev"
paperless_ngx_oidc_provider_id: "pocketid"
paperless_ngx_oidc_provider_name: "Pocket ID"
paperless_ngx_oidc_client_id: "d1cd5641-7d8f-4ec2-bb53-8cb5bf558f2f"
# Account creation from OIDC. BOTH true = fully automatic provisioning.
paperless_ngx_oidc_auto_signup: true
paperless_ngx_oidc_allow_signups: true
# Username/password form is disabled — Pocket ID is the ONLY way in.
paperless_ngx_disable_local_login: true
# Login page redirects straight to Pocket ID instead of showing the local form.
paperless_ngx_oidc_redirect_login: true

# --- Tandoor ------------------------------------------------------------------
# Replaces Mealie at the SAME hostname. Deliberately does NOT reuse Mealie's
# Pocket ID OIDC client (id 93041358-e45e-4e44-b838-3c758cfe4681) — a NEW
# client must be registered for Tandoor (Q4 decision). tandoor_oidc_client_id
# and vault_tandoor_oidc_client_secret are left blank below: the operator
# fills them in after manually registering that client in Pocket ID (primary
# flow step 1, roles/tandoor/README.md). Until then, the role's FR-12 assert
# fails loudly and on purpose.
tandoor_url: "https://recipes.de.int.wahlberger.dev"
tandoor_oidc_provider_name: "Pocket ID"
tandoor_oidc_provider_id: "pocket-id"
tandoor_oidc_client_id: "79e5970e-7c2e-45be-b667-58dfd9539fd8"

# --- Immich -------------------------------------------------------------------
# New service — registered as its own Pocket ID app (see roles/immich/README.md
# for the redirect URIs used).
immich_url: "https://photos.de.int.wahlberger.dev"
immich_oidc_provider_name: "Pocket ID"
immich_oidc_client_id: "90017f0a-235c-4314-9728-9e2e2dc057b5"

# --- Forgejo ------------------------------------------------------------------
# Git forge + container registry, LAN/VPN only. forgejo_oidc_client_id is
# blank until the operator registers a Forgejo client in Pocket ID (redirect
# URI https://git.de.int.wahlberger.dev/user/oauth2/pocket-id/callback, see
# roles/forgejo/README.md); the role's assert fails loudly until then, as for
# tandoor originally. Fill in the real UUID here.
forgejo_url: "https://git.de.int.wahlberger.dev"
forgejo_ssh_port: 2222
forgejo_oidc_provider_name: "pocket-id"
forgejo_oidc_client_id: "e49c8dc5-2a21-4735-bf3b-cc3c8dadbf2e"

# --- Beszel agent ---------------------------------------------------------------
# REQUIRED, but can't be set until roles/beszel_hub has booted once and
# generated its own SSH keypair — see roles/beszel_agent/README.md. Leaving
# this empty makes the role's assert fail cleanly rather than deploying an
# agent that will never be able to connect to anything.
beszel_agent_hub_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKz/U0NWhnhm19QvVrNu6sVuXiEPVdoPCrGMC8MzTNdH"

# --- Homepage (dashboard) ------------------------------------------------------
# Links cloud-wahlberger-dev's and this NAS's services. rpi-karlsruhe is
# intentionally excluded — it's legacy, being retired.
homepage_url: "https://www.de.int.wahlberger.dev"

# --- Samba --------------------------------------------------------------------
# Matches the existing backup layout (server_backup/samba/Delat/) and the
# share name rpi-karlsruhe already used — restore the backup into
# samba_share_path (/mnt/data/samba/Delat) so the directory name lines up.
samba_share_name: "Delat"

# --- Secrets (Ansible Vault) ---------------------------------------------------
# Never put secrets in plaintext. They live in an encrypted sibling file
# `vault.yml` in this directory, each with a `vault_` prefix, surfaced here
# under a friendly name. `| default('')` keeps roles failing with a clear
# assert (rather than a bare "undefined variable") when the Vault is absent.
#
# Scaffold and the exact contents are in `vault.yml.example`. Create the real,
# encrypted file with:
#
#     ansible-vault create inventories/production/group_vars/all/vault.yml
#
# and run plays with `--ask-vault-pass` (or --vault-password-file .vault_pass).
# See README.md -> "Secrets with Ansible Vault" for the full workflow.

# PostgreSQL password shared by the paperless-db and paperless-ngx containers.
# Migrating from rpi-karlsruhe? Reuse its EXISTING value or the restored DB
# dump won't authenticate.
paperless_ngx_db_password: "{{ vault_paperless_ngx_db_password | default('') }}"

# OIDC client secrets from Pocket ID. Migrating from rpi-karlsruhe? Reuse the
# EXISTING values — they belong to the client_ids above, not to this host.
paperless_ngx_oidc_client_secret: "{{ vault_paperless_ngx_oidc_client_secret | default('') }}"

# Tandoor's Postgres password and Django SECRET_KEY (48 hex chars each,
# generated fresh — no migration/reuse concern). Its OIDC client secret is
# blank until the operator registers the new Pocket ID client (see the
# --- Tandoor --- section above).
tandoor_db_password: "{{ vault_tandoor_db_password | default('') }}"
tandoor_secret_key: "{{ vault_tandoor_secret_key | default('') }}"
tandoor_oidc_client_secret: "{{ vault_tandoor_oidc_client_secret | default('') }}"

# Immich's Postgres password and OIDC client secret.
immich_db_password: "{{ vault_immich_db_password | default('') }}"
immich_oidc_client_secret: "{{ vault_immich_oidc_client_secret | default('') }}"

# Forgejo secrets (generate as described in vault.yml.example) and the Pocket
# ID client secret for the client registered above.
forgejo_secret_key: "{{ vault_forgejo_secret_key | default('') }}"
forgejo_internal_token: "{{ vault_forgejo_internal_token | default('') }}"
forgejo_oauth2_jwt_secret: "{{ vault_forgejo_oauth2_jwt_secret | default('') }}"
forgejo_lfs_jwt_secret: "{{ vault_forgejo_lfs_jwt_secret | default('') }}"
forgejo_admin_password: "{{ vault_forgejo_admin_password | default('') }}"
forgejo_oidc_client_secret: "{{ vault_forgejo_oidc_client_secret | default('') }}"

# Cloudflare DNS API token for Caddy's DNS-01 challenge (Zone:DNS:Edit on
# wahlberger.dev). Same token rpi-karlsruhe's Traefik already uses for the
# same zone — reused rather than minted fresh.
cloudflare_dns_api_token: "{{ vault_cloudflare_dns_api_token | default('') }}"

# restic REST server: the single client is cloud-wahlberger-dev. The htpasswd
# password is the shared secret the Pi's server used (BD-BR-09); the repository
# password is cloud's vault_restic_backup_repo_password, used by the daily
# maintenance run to forget/prune the append-only repository.
restic_server_clients:
  - username: cloud
    password: "{{ vault_restic_server_cloud_htpasswd_password | default('') }}"
restic_server_maintenance_repo_password: "{{ vault_restic_server_cloud_repo_password | default('') }}"

# Resend API key for failure notification emails (notify_failure role). Same
# account/key as cloud-wahlberger-dev and pi-de-int-wahlberger-dev.
notify_failure_resend_api_key: "{{ vault_notify_failure_resend_api_key | default('') }}"

---
# VM fixture inventory (BD-FR-155): the disposable openSUSE Tumbleweed VM that
# every [V] scenario runs against. Exactly one host, in group `nas`, so the
# production group_vars structure applies unchanged. Replace the address with
# the VM's real one (or override with `-e ansible_host=...`). Never point this
# at nas, cloud or pi. See README.md in this directory.
all:
  children:
    nas:
      hosts:
        nas-vm-fixture:
          ansible_host: 192.168.122.50

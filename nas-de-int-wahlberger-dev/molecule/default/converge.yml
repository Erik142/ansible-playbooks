---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
    - role: notify_failure
    - role: disk_space
    - role: ssh_authorized_keys
    - role: security
    # NOT firewall: firewalld's nftables backend fails inside any container
    # (isolated network namespace) — confirmed a general Docker limitation,
    # not host-specific (raw `nft` works fine in the same environment; it's
    # firewalld's own rule application that fails). Testing "does the
    # firewall actually apply" isn't meaningful in a container anyway, since
    # its network stack isn't representative of the real host.

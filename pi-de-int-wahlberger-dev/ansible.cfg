# Ansible configuration for the `pi-de-int-wahlberger-dev` playbook.
# Only intentional, non-default settings are listed here; everything else uses
# ansible-core defaults. Full reference:
# https://docs.ansible.com/ansible/latest/reference_appendices/config.html
[defaults]
# Let `ansible-playbook site.yml` run without passing -i on the command line.
inventory = inventories/production/hosts.yml

# NOTE: roles_path is intentionally NOT overridden. The default search path
# already includes both the playbook-adjacent roles/ (local roles) and
# ~/.ansible/roles (where `ansible-galaxy role install` puts external roles
# like geerlingguy.security).

# Quiet, predictable Python interpreter discovery on the managed host.
interpreter_python = auto_silent

# Trust-on-first-use host key checking (keep it on; accept the key on first run).
host_key_checking = true

# Don't scatter *.retry files across the repo.
retry_files_enabled = false

# Per-task timing and a "slowest tasks" recap. Provided by the ansible.posix
# collection (see requirements.yml).
callbacks_enabled = ansible.posix.profile_tasks

# Cache gathered facts between runs to speed up repeated plays.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_cache/facts
fact_caching_timeout = 7200

[ssh_connection]
# Reuse SSH connections and avoid re-transferring modules on every task.
# pipelining needs `requiretty` disabled in sudoers (the default on Debian).
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

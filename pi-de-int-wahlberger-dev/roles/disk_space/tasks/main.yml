---
- name: Deploy the disk space check script
  ansible.builtin.template:
    src: disk-space-check.sh.j2
    dest: /usr/local/bin/disk-space-check.sh
    owner: root
    group: root
    mode: "0700"

- name: Deploy the disk space check systemd service unit
  ansible.builtin.template:
    src: disk-space-check.service.j2
    dest: /etc/systemd/system/disk-space-check.service
    owner: root
    group: root
    mode: "0644"

- name: Deploy the disk space check systemd timer unit
  ansible.builtin.template:
    src: disk-space-check.timer.j2
    dest: /etc/systemd/system/disk-space-check.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable and start the disk space check timer
  ansible.builtin.systemd:
    name: disk-space-check.timer
    enabled: true
    state: started
    daemon_reload: true

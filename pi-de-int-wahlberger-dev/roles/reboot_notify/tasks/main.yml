---
# Debian doesn't ship Ubuntu's update-notifier-common (confirmed: not even
# in the apt cache on this host), so nothing creates
# /var/run/reboot-required by default — without it, neither this role's own
# check nor geerlingguy.security's security_autoupdate_reboot actually has a
# signal to act on. needrestart's own kernel-version detection is what
# creates it here instead — see check-reboot-required.sh.j2.
- name: Install needrestart
  ansible.builtin.apt:
    name: needrestart
    state: present

- name: Deploy the reboot-required check script
  ansible.builtin.template:
    src: check-reboot-required.sh.j2
    dest: /usr/local/bin/check-reboot-required.sh
    owner: root
    group: root
    mode: "0700"

# A separate file from needrestart's own /etc/apt/apt.conf.d/99needrestart —
# must not overwrite that package-owned conffile.
- name: Deploy the apt post-invoke hook that maintains /var/run/reboot-required
  ansible.builtin.template:
    src: reboot-required.hook.j2
    dest: /etc/apt/apt.conf.d/99-reboot-required
    owner: root
    group: root
    mode: "0644"

- name: Create the reboot_notify config directory
  ansible.builtin.file:
    path: /etc/reboot-notify
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the reboot notice email template
  ansible.builtin.copy:
    src: email-template.html
    dest: /etc/reboot-notify/email-template.html
    owner: root
    group: root
    mode: "0644"

# Superseded by check-reboot-required.sh emailing synchronously at
# detection time (see that script) — a shutdown-time systemd hook here
# turned out to be unreliable (Before=shutdown.target is only a soft
# ordering hint; confirmed it silently never ran under a busy shutdown
# transaction). Cleans up any previously deployed instance.
- name: Check whether the old reboot-notify shutdown-hook unit exists
  ansible.builtin.stat:
    path: /etc/systemd/system/reboot-notify.service
  register: reboot_notify_old_unit_file

- name: Stop and disable the old reboot-notify shutdown-hook service
  ansible.builtin.systemd:
    name: reboot-notify.service
    enabled: false
    state: stopped
  when: reboot_notify_old_unit_file.stat.exists

- name: Remove the old reboot-notify shutdown-hook unit file
  ansible.builtin.file:
    path: /etc/systemd/system/reboot-notify.service
    state: absent
  when: reboot_notify_old_unit_file.stat.exists

- name: Reload systemd after removing the old shutdown-hook unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: reboot_notify_old_unit_file.stat.exists

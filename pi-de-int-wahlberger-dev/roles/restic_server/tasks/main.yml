---
- name: Validate restic_server inputs are present
  ansible.builtin.assert:
    that:
      - restic_server_clients | length > 0
    fail_msg: >-
      restic_server_clients is empty. Set it in group_vars — one
      {username, password} entry per backup client. See
      roles/restic_server/README.md.
    quiet: true

- name: Validate each restic_server_clients entry has a password
  ansible.builtin.assert:
    that:
      - item.password | length > 0
    fail_msg: >-
      restic_server_clients entry "{{ item.username }}" has an empty
      password — set its matching vault_* secret. See
      roles/restic_server/README.md.
    quiet: true
  loop: "{{ restic_server_clients }}"
  loop_control:
    label: "{{ item.username }}"

# community.general.htpasswd needs passlib on the managed host to compute
# the bcrypt hash.
- name: Install passlib for the htpasswd module
  ansible.builtin.apt:
    name: python3-passlib
    state: present

- name: Create the restic_server data directory
  ansible.builtin.file:
    path: "{{ restic_server_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0777"

# mode "0777": same reasoning as elsewhere in this repo (see the semaphore
# role) — the exact non-root UID rest-server runs as inside the container
# isn't pinned down, so this is the safer default over guessing at a
# tighter mode.
- name: Create the htpasswd entry for each backup client
  community.general.htpasswd:
    path: "{{ restic_server_data_dir }}/.htpasswd"
    name: "{{ item.username }}"
    password: "{{ item.password }}"
    hash_scheme: bcrypt
    mode: "0777"
  loop: "{{ restic_server_clients }}"
  loop_control:
    label: "{{ item.username }}"

# This server has no reason to ever be reachable from the public internet,
# unlike Caddy's 80/443 — scoped to the home LAN/ZeroTier range instead of
# firewall_allowed_tcp_ports' allow-from-anywhere entries.
- name: Allow the REST server port from the home LAN/ZeroTier range only
  community.general.ufw:
    rule: allow
    direction: in
    from_ip: "{{ restic_server_allowed_src }}"
    to_port: "{{ restic_server_port | string }}"
    proto: tcp
    comment: "restic REST server (backup target)"

- name: Deploy the Restic REST server container
  ansible.builtin.include_role:
    name: container
  vars:
    container_name: restic-server
    container_quadlet_src: restic-server.container.j2

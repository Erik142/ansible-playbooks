---
argument_specs:
  main:
    short_description: Install Podman and Quadlet support on a Debian host.
    options:
      podman_packages:
        type: list
        elements: str
        required: false
        description: Packages that provide Podman, the Docker-compat CLI, and Quadlet.
      podman_data_dir:
        type: path
        required: false
        description: Root directory for persistent container data.
      podman_quadlet_dir:
        type: path
        required: false
        description: Directory systemd reads Quadlet unit files from.
      podman_enable_socket:
        type: bool
        required: false
        description: Whether to enable and start podman.socket.
      podman_image_prune_enabled:
        type: bool
        required: false
        description: Whether to install and enable the periodic image-prune timer.
      podman_image_prune_on_calendar:
        type: str
        required: false
        description: systemd OnCalendar expression for the image-prune timer.
      podman_image_prune_min_age:
        type: str
        required: false
        description: Only prune images older than this (podman `until` filter, e.g. 168h).

---
- name: Install Podman and Quadlet support
  ansible.builtin.apt:
    name: "{{ podman_packages }}"
    state: present

- name: Create the persistent container data directory
  ansible.builtin.file:
    path: "{{ podman_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the Quadlet unit directory exists
  ansible.builtin.file:
    path: "{{ podman_quadlet_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Enable and start the Podman API socket
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started
  when: podman_enable_socket | bool

# Rootful Podman published ports (DNAT to the container bridge) need IPv4
# forwarding. netavark only flips it on at runtime when containers start, so a
# package upgrade that re-applies sysctl defaults silently turns it off again
# and every routed connection to a published port hangs. Persist it.
- name: Persist IPv4 forwarding for published container ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-podman-ip-forward.conf
    sysctl_set: true
    state: present
    reload: true

- name: Deploy the image-prune systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - podman-image-prune.service
    - podman-image-prune.timer
  when: podman_image_prune_enabled | bool
  notify: Reload systemd

- name: Apply systemd unit changes before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start the image-prune timer
  ansible.builtin.systemd:
    name: podman-image-prune.timer
    enabled: true
    state: started
  when: podman_image_prune_enabled | bool

- name: Disable the image-prune timer
  ansible.builtin.systemd:
    name: podman-image-prune.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not (podman_image_prune_enabled | bool)

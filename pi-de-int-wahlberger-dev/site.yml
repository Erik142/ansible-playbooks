---
# Top-level playbook. Convention: `site.yml` applies the *entire* configuration
# to every host.
#
# Run with:  ansible-playbook site.yml
# Limit to one role:  ansible-playbook site.yml --tags semaphore
- name: Configure the pi.de.int.wahlberger.dev host
  hosts: pi
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common]
    # Early: other roles' units can hook OnFailure= into the unit this role
    # deploys.
    - role: notify_failure
      tags: [notify_failure]
    # Periodic disk usage check, emailing via notify_failure — the only
    # thing in this stack that watches disk space at all.
    - role: disk_space
      tags: [disk_space]
    # Personal + Semaphore automation SSH keys, authorized before hardening.
    - role: ssh_authorized_keys
      tags: [ssh_authorized_keys]
    # Harden the host before anything else listens on the network.
    - role: geerlingguy.security
      tags: [security]
    # After notify_failure (reuses its Resend credentials) and security
    # (enables security_autoupdate_reboot, the reboot this role emails
    # about).
    - role: reboot_notify
      tags: [reboot_notify]
    - role: firewall
      tags: [firewall]
    # Mounts the external USB drive before podman needs somewhere under it
    # to put container data.
    - role: storage
      tags: [storage]
    - role: podman
      tags: [podman]
    # Reports to beszel_hub on cloud-wahlberger-dev. After podman: needs its
    # rootful API socket to already exist to grant this agent access to it.
    - role: beszel_agent
      tags: [beszel_agent]
    # Ensure this host's public DNS records exist before Caddy needs them.
    - role: cloudflare_dns
      tags: [cloudflare_dns]
    # Reverse proxy (creates the shared network) for Semaphore.
    - role: caddy
      tags: [caddy]
    - role: semaphore
      tags: [semaphore]
    # Backup target nas-de-int-wahlberger-dev pushes nightly backups to.
    - role: restic_server
      tags: [restic_server]

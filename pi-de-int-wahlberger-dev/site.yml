---
# Top-level playbook. Convention: `site.yml` applies the *entire* configuration
# to every host.
#
# Run with:  ansible-playbook site.yml
# Limit to one role:  ansible-playbook site.yml --tags semaphore
- name: Configure the pi.de.int.wahlberger.dev host
  hosts: pi
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common]
    # Personal + Semaphore automation SSH keys, authorized before hardening.
    - role: ssh_authorized_keys
      tags: [ssh_authorized_keys]
    # Harden the host before anything else listens on the network.
    - role: geerlingguy.security
      tags: [security]
    - role: firewall
      tags: [firewall]
    # Mounts the external USB drive before podman needs somewhere under it
    # to put container data.
    - role: storage
      tags: [storage]
    - role: podman
      tags: [podman]
    # Ensure this host's public DNS records exist before Caddy needs them.
    - role: cloudflare_dns
      tags: [cloudflare_dns]
    # Reverse proxy (creates the shared network) for Semaphore.
    - role: caddy
      tags: [caddy]
    - role: semaphore
      tags: [semaphore]

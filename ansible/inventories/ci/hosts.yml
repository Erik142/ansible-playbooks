---
# Production inventory. Structure only; variables live in group_vars/.
#
# The inventory name is the host's real FQDN: common sets the system hostname
# from it, so it must stay ci.de.wahlberger.dev (the name the VPS already has).
# Ansible connects over ZeroTier to the member address 10.243.73.1 (vm_zt_ip in
# group_vars). No DNS name: on ops the search domain de.wahlberger.dev turns
# ci.de.int.wahlberger.dev into a public Cloudflare name that refuses SSH.
all:
  children:
    ci:
      hosts:
        ci.de.wahlberger.dev:
          ansible_host: 10.243.73.1

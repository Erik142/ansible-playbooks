---
# Inventory of the edge host (openSUSE Tumbleweed, replaces the former Debian cloud host, cloud.wahlberger.dev).
# Host and group structure only. Variables live in group_vars/.
all:
  children:
    edge:
      hosts:
        edge.de.wahlberger.dev:
          # Trailing dot: an absolute name. Without it ops applies its search domain
          # de.wahlberger.dev and resolves to a public Cloudflare address.
          ansible_host: edge.de.int.wahlberger.dev.

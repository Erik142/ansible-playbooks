---
# Hush "ok" drop-in for every long-running unit that notify-failure@ covers. The
# drop-in is written to /etc/systemd/system/<unit>.d/hush.conf. A changed drop-in
# reloads systemd and restarts that unit once, so the change takes effect now.
- name: Create the drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ hush_recovery_units }}"

- name: Deploy the Hush recovery drop-in
  ansible.builtin.copy:
    src: hush-recovery.conf
    dest: "/etc/systemd/system/{{ item }}.d/hush.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ hush_recovery_units }}"
  register: hush_recovery_dropins

# systemd must load the new drop-ins before the units restart. One reload covers
# all of them: a reload per unit repeats the same work for every restart. Skipped
# when nothing changed, and in check mode, where the drop-ins are not written.
- name: Reload systemd once for the changed drop-ins
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - hush_recovery_dropins.results | selectattr('changed') | list | length > 0

# Only the units whose drop-in changed are restarted. Skipped in check mode, where
# the drop-in is not written and the unit may not exist.
- name: Restart the units whose drop-in changed
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ hush_recovery_dropins.results | selectattr('changed') | map(attribute='item') | list }}"
  when: not ansible_check_mode

---
# Restarts Caddy when the Caddyfile or the network unit changes. (The container
# helper independently restarts it when caddy.container itself changes.)
# Check mode never writes the unit, so the service does not exist yet. Skip it there;
# a real apply restarts it.
- name: Restart caddy
  ansible.builtin.systemd:
    name: caddy.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

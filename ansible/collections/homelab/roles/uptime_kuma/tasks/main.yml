---
- name: Validate Uptime Kuma and oauth2-proxy inputs are present
  ansible.builtin.assert:
    that:
      - uptime_kuma_url | length > 0
      - uptime_kuma_oidc_client_id | length > 0
      - uptime_kuma_oidc_client_secret | length > 0
      - uptime_kuma_cookie_secret | length > 0
      - pocket_id_app_url | length > 0
    fail_msg: >-
      Uptime Kuma is not fully configured. Set uptime_kuma_url, pocket_id_app_url and
      uptime_kuma_oidc_client_id in group_vars, and provide the Vault secrets
      vault_uptime_kuma_oidc_client_secret and vault_uptime_kuma_cookie_secret (run
      with --ask-vault-pass). See roles/uptime_kuma/README.md.
    quiet: true

- name: Ensure the Uptime Kuma host directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ uptime_kuma_data_dir }}"
      owner: root
      group: root
      mode: "0750"
    - path: "{{ uptime_kuma_db_dir }}"
      owner: "{{ uptime_kuma_data_uid }}"
      group: "{{ uptime_kuma_data_gid }}"
      mode: "0750"

# 0600 so the OIDC client secret and cookie secret are not exposed in the world-readable
# Quadlet unit. A change restarts oauth2-proxy through the handler below.
- name: Render the oauth2-proxy environment file
  ansible.builtin.template:
    src: oauth2-proxy.env.j2
    dest: "{{ uptime_kuma_data_dir }}/oauth2-proxy.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart oauth2-proxy

- name: Deploy the oauth2-proxy container
  ansible.builtin.include_role:
    name: container
  vars:
    container_name: oauth2-proxy
    container_quadlet_src: oauth2-proxy.container.j2

- name: Deploy the Uptime Kuma container
  ansible.builtin.include_role:
    name: container
  vars:
    container_name: uptime-kuma
    container_quadlet_src: uptime-kuma.container.j2

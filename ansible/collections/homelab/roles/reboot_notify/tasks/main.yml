---
- name: Create the reboot_notify config directory
  ansible.builtin.file:
    path: /etc/reboot-notify
    state: directory
    owner: root
    group: root
    mode: "0755"

# A template (not a static copy): bakes in the configured
# security_autoupdate_reboot_strategy so the email says how the reboot
# will actually be carried out, not just that one is pending.
- name: Deploy the reboot notice email template
  ansible.builtin.template:
    src: email-template.html.j2
    dest: /etc/reboot-notify/email-template.html
    owner: root
    group: root
    mode: "0644"

- name: Deploy the reboot notice script
  ansible.builtin.template:
    src: reboot-notify.sh.j2
    dest: /usr/local/bin/reboot-notify.sh
    owner: root
    group: root
    mode: "0700"

---
# Default variables for the `freshrss` role.

# FreshRSS image, pinned to a specific release for reproducibility.
freshrss_image: docker.io/freshrss/freshrss:1.31.0

# Host directory for the rendered, root-only (0600) environment file that carries the
# secrets (OIDC client secret, crypto key, admin password).
freshrss_data_dir: /opt/podman/freshrss

# Host directory bind-mounted at /var/www/FreshRSS/data (SQLite DB, config.php). It was
# a named volume on the Debian host. Under /opt/podman so restic_backup covers it.
freshrss_db_dir: "{{ freshrss_data_dir }}/data"

# Owner of freshrss_db_dir as on the live host (verified: 0:33, mode 775). The container
# runs as root and the web server as www-data (gid 33).
freshrss_data_uid: 0
freshrss_data_gid: 33

# REQUIRED: public https:// URL FreshRSS is served on. Must match the DNS record and
# the caddy_sites host. Set it in group_vars.
freshrss_app_url: ""

# REQUIRED: FreshRSS admin username. It MUST match the Pocket ID username exactly
# (lowercase). FreshRSS does not auto-create OIDC users, so the entrypoint pre-creates
# this user, and a mismatch with the OIDC preferred_username claim gives a 403.
freshrss_admin_user: ""

# Optional email stamped on the admin account.
freshrss_admin_email: ""

# UI language and timezone passed to the install/runtime.
freshrss_language: en
freshrss_timezone: Europe/Stockholm

# Minutes field of the built-in feed-refresh cron. Auto-refresh is DISABLED in the image
# unless this is set. "" disables it, "*/20" runs every 20 minutes.
freshrss_cron_min: "13,43"

# CIDR(s) FreshRSS (Apache mod_remoteip) trusts as the reverse proxy. Caddy reaches
# FreshRSS over the caddy.network bridge; these cover Podman's default bridge ranges.
freshrss_trusted_proxy: "10.88.0.0/16 10.89.0.0/16"

# --- OpenID Connect (Pocket ID) ---------------------------------------------
freshrss_oidc_provider_metadata_url: "{{ pocket_id_app_url }}/.well-known/openid-configuration"

# REQUIRED: OAuth2 client ID issued by Pocket ID for FreshRSS. Not secret (a UUID).
freshrss_oidc_client_id: ""

freshrss_oidc_scopes: "openid email profile"
freshrss_oidc_remote_user_claim: preferred_username
freshrss_oidc_x_forwarded_headers: "X-Forwarded-Proto X-Forwarded-Host"

# REQUIRED secrets, from Ansible Vault (surfaced in group_vars).
freshrss_oidc_client_secret: ""
freshrss_oidc_crypto_key: ""
freshrss_admin_password: ""

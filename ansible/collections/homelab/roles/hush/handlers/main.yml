---
# Restarts hush after its config or a secret file changes. The container helper
# restarts it separately when hush.container itself changes.
- name: Restart hush
  ansible.builtin.systemd:
    name: hush.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

# A changed ExecStartPost drop-in takes effect only on the next start. Notified only when
# the drop-in changed; tasks/main.yml sets hush_watched_restart after hush answers
# (a watched unit started while hush is down would fail its ExecStartPost).
- name: Restart watched units
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: "{{ hush_systemd_watched_units }}"
  loop_control:
    label: "{{ item }}"
  when:
    - not ansible_check_mode
    - hush_watched_restart | default(false) | bool

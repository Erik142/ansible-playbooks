---
# Full configuration of the ops host (ops.de.wahlberger.dev): Semaphore UI, Caddy,
# hush, and the automation SSH key that Semaphore uses. Reached over ZeroTier only
# (public SSH is key-only, but the workstation connects over ZeroTier).
# Run from ansible/ (check mode first, always):
#   ansible-playbook wahlberger.homelab.ops --check --diff
#   ansible-playbook wahlberger.homelab.ops
# Limit to one role: ansible-playbook wahlberger.homelab.ops --tags caddy
# Semaphore's self-run skips semaphore,zerotier (see the ops README).
- name: Configure the ops host
  hosts: ops
  become: true
  gather_facts: true
  pre_tasks:
    # Hush maintenance window for this apply. Tagged always so a --tags run opens it too.
    - name: Open the hush maintenance window
      ansible.builtin.include_role:
        name: wahlberger.homelab.hush_maintenance
        tasks_from: open
      tags: [always]
  roles:
    - role: wahlberger.homelab.common
      tags: [common]
    # Early: other roles' units hook OnFailure= into the unit this role deploys.
    - role: wahlberger.homelab.notify_failure
      tags: [notify_failure]
    - role: wahlberger.homelab.disk_space
      tags: [disk_space]
    # Personal and Semaphore automation SSH keys, authorized before hardening.
    - role: wahlberger.homelab.ssh_authorized_keys
      tags: [ssh_authorized_keys]
    # Harden the host before anything else listens on the network.
    - role: wahlberger.homelab.security
      tags: [security]
    - role: wahlberger.homelab.reboot_notify
      tags: [reboot_notify]
    - role: wahlberger.homelab.firewall
      tags: [firewall]
    - role: wahlberger.homelab.podman
      tags: [podman]
    # ZeroTier carries the UI and the monitoring traffic; it must be up before
    # the services that bind to its address.
    - role: wahlberger.homelab.zerotier
      tags: [zerotier]
    # After podman: needs its rootful API socket to grant this agent access.
    - role: wahlberger.homelab.beszel_agent
      tags: [beszel_agent]
    # DNS records before Caddy needs them for the DNS-01 certificate.
    - role: wahlberger.homelab.cloudflare_dns
      tags: [cloudflare_dns]
    - role: wahlberger.homelab.caddy
      tags: [caddy]
    - role: wahlberger.homelab.semaphore
      tags: [semaphore]
    # Hush alerting. ZeroTier only, behind caddy.
    - role: wahlberger.homelab.hush
      tags: [hush]
    # Last: backs up what the roles above wrote under the Podman data dir.
    - role: wahlberger.homelab.restic_backup
      tags: [restic_backup]
    # Hush "ok" drop-ins for the long-running units with an OnFailure= hook that the
    # hush role does not cover. Last, so every unit exists.
    - role: wahlberger.homelab.hush_recovery
      tags: [hush_recovery]
  post_tasks:
    - name: Close the hush maintenance window
      ansible.builtin.include_role:
        name: wahlberger.homelab.hush_maintenance
        tasks_from: close
      tags: [always]
